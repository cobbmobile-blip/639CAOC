<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — Op Status</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .doc-modal { max-width: 900px; width: 100%; max-height: calc(100vh - 32px); display: flex; flex-direction: column; }
  .doc-modal .doc { flex: 1; max-height: none; }
  .mine { border-color: var(--accent); }

  .prod-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .prod-tiles .tile { gap: 6px; }
  .prod-tiles .tile.locked { opacity: .45; border-style: dashed; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--ok); }
  .upd { font: 600 10.5px var(--mono); letter-spacing: .06em; color: var(--warn); }
  .upd.new { color: var(--ok); }

  .mx th, .mx td { text-align: center; white-space: nowrap; }
  .mx th:first-child, .mx td:first-child { text-align: left; }
  .mx td:first-child { white-space: normal; min-width: 180px; }
  .mx tr.me td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .mx tfoot td { font-weight: 600; border-top: 2px solid var(--line); }
  .cell { font: 600 11.5px var(--mono); padding: 3px 7px; border-radius: 4px; display: inline-block; }
  .cell.cur { color: var(--ok); }
  .cell.old { color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent); }
  .cell.none { color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, transparent); }
  .cell.na { color: var(--muted); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }

  .lines { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  @media (max-width: 760px) { .lines { grid-template-columns: minmax(0, 1fr); } }
  .gcard { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
  .gcard.me { border-color: var(--accent); }
  .gcard.open { border-style: dashed; border-color: var(--warn); }
  .gcard h3 { margin: 0; font-size: 14px; }
  .gcard .sub { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .line { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; padding: 4px 0; border-top: 1px solid var(--line); }
  .line .m { font-family: var(--mono); color: var(--accent); width: 38px; flex: none; }
  .line .g { flex: 1; min-width: 0; }
  .line .t { font-family: var(--mono); color: var(--muted); flex: none; }
  .dks { border: 1px dashed var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
</style>
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  // Units sign in as their group; AOC staff may view as observers
  if (!AOC.UnitAuth.group() && !AOC.Auth.user()) { location.replace("unit-login.html"); throw new Error("auth required"); }
</script>
<script src="js/products.js"></script>
<script src="js/pr.js"></script>
<script src="js/ato.js"></script>
<script src="js/package.js"></script>
<script src="js/jceoi-data.js"></script>
<script src="js/jceoi.js"></script>
<script src="js/iff.js"></script>
<script src="js/miz.js"></script>
<script src="js/tdl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<main class="wrap">
  <section class="campaign-head">
    <div>
      <div class="op" id="viewer"></div>
      <h1 id="opName"></h1>
      <div class="campaign-meta" id="meta"></div>
    </div>
    <div class="campaign-select">
      <label for="campaign">Campaign</label>
      <select id="campaign"></select>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="panel hidden" id="hostPanel" style="margin-bottom:16px"></section>

  <section class="panel" id="groupPanel" style="margin-bottom:16px"></section>

  <section class="panel hidden" id="askPanel" style="margin-bottom:16px"></section>
  <datalist id="unitTargets"></datalist>

  <section class="panel" style="margin-bottom:16px">
    <div class="panel-head">
      <div><h2>Product board</h2><div class="muted small">Released products apply to every participating group. Bars show how many groups hold the current version.</div></div>
    </div>
    <div class="prod-tiles" id="board"></div>
  </section>

  <section class="panel" style="margin-bottom:16px">
    <div class="panel-head">
      <div><h2>Distribution</h2><div class="muted small">Which version of each product every group has pulled from this portal.</div></div>
    </div>
    <div class="table-scroll"><table class="mx" id="matrix"></table></div>
    <div class="legend">
      <span><span class="cell cur">✓ v2</span> current</span>
      <span><span class="cell old">v1 → v2</span> outdated</span>
      <span><span class="cell none">not pulled</span> released, not downloaded</span>
    </div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <div><h2 id="linesTitle">ATO lines by group</h2><div class="muted small" id="linesSub"></div></div>
    </div>
    <div class="lines" id="lines"></div>
  </section>
</main>

<script>
  const { Store, UnitAuth, Auth, esc, PRODUCTS, toast, zulu, download, htmlToText } = AOC;
  AOC.renderChrome({ unit: true });
  const me = UnitAuth.group();          // null when viewing as AOC staff
  const staff = me ? null : Auth.user();

  const campaigns = me ? Store.db.campaigns.filter(c => c.groups.includes(me.id)) : Store.db.campaigns;
  let cid = (() => { try { return localStorage.getItem("aoc.unitCampaign"); } catch { return null; } })();
  if (!campaigns.some(c => c.id === cid)) cid = staff ? Store.currentCampaignId() : campaigns[0]?.id;

  const sel = document.getElementById("campaign");
  sel.innerHTML = campaigns.map(c => `<option value="${c.id}">OP ${esc(c.opName)} — ${esc(c.theater)}</option>`).join("");
  sel.value = cid;
  sel.onchange = () => { cid = sel.value; try { localStorage.setItem("aoc.unitCampaign", cid); } catch {} render(); };

  document.getElementById("viewer").textContent = me ? `Op status · ${me.name}` : `Op status · viewing as AOC staff (${staff.callsign})`;

  // ---------- helpers ----------
  const camp = () => Store.campaign(cid);
  // staff functions (PCON, MAAP) never appear here, even if an older release shared them
  const staffOnly = id => AOC.PACKAGE?.INTERNAL.has(id);
  const released = () => Object.entries(camp().shared || {}).filter(([id]) => !staffOnly(id)).sort((a, b) => (PRODUCTS[a[0]]?.stage || 9) - (PRODUCTS[b[0]]?.stage || 9));
  const activeGroups = () => camp().groups.map(id => Store.group(id)).filter(Boolean);
  const atoLines = () => camp().shared?.ato?.data?.missions || [];
  function ctxFor(s) {
    const u = Store.db.users.find(x => x.callsign === s.by);
    return { campaign: camp(), user: { callsign: s.by || "AOC", role: u?.role || "AOC staff" }, approval: s.approval, group: id => Store.group(id) };
  }
  const renderShared = (pid, s) => PRODUCTS[pid].render(s.data, ctxFor(s));
  const opFile = () => camp().opName.replace(/\s+/g, "_");
  const receive = (pid, s) => { if (me && s.groups.includes(me.id)) Store.markReceived(cid, me.id, pid, s.version); };
  function until(iso) {
    if (!iso) return "—";
    const ms = new Date(iso) - Date.now();
    if (ms < 0) return "in progress";
    const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5);
    return `${zulu(new Date(iso))} (in ${d ? d + "d " : ""}${h}h)`;
  }
  function cellState(gid, pid, s) {
    if (!s.groups.includes(gid)) return { cls: "na", txt: "—" };
    const r = Store.received(cid, gid, pid);
    if (r >= s.version) return { cls: "cur", txt: `✓ v${s.version}` };
    if (r > 0) return { cls: "old", txt: `v${r} → v${s.version}` };
    return { cls: "none", txt: "not pulled" };
  }

  // ---------- actions ----------
  function viewDoc(pid) {
    const s = camp().shared[pid];
    receive(pid, s);
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="panel doc-modal">
      <div class="panel-head"><h2>${PRODUCTS[pid].code} · ${esc(PRODUCTS[pid].name)} <span class="muted small">v${s.version}</span></h2>
        <div class="toolbar"><button class="btn sm" data-txt>Download .txt</button><button class="btn sm" data-print>Print / PDF</button><button class="btn sm" data-x>Close</button></div></div>
      <article class="doc">${renderShared(pid, s)}</article></div>`;
    document.body.appendChild(back);
    const close = () => { back.remove(); render(); };
    back.onclick = e => { if (e.target === back) close(); };
    back.querySelector("[data-x]").onclick = close;
    back.querySelector("[data-txt]").onclick = () => download(`${opFile()}_${PRODUCTS[pid].code}_v${s.version}.txt`, htmlToText(renderShared(pid, s)));
    back.querySelector("[data-print]").onclick = () => printDoc(renderShared(pid, s), `${PRODUCTS[pid].code} v${s.version}`);
  }
  function printDoc(html, title) {
    const w = window.open("", "_blank");
    if (!w) { toast("Allow pop-ups to print"); return; }
    w.document.write(`<!doctype html><html data-theme="staff"><head><meta charset="utf-8"><title>${esc(title)}</title>
      <link rel="stylesheet" href="css/styles.css"><style>body{background:#fff}.doc{max-height:none;border:0}</style></head>
      <body><article class="doc">${html}</article></body></html>`);
    w.document.close();
    w.onload = () => w.print();
  }
  // Group pack: every product released to the group, plus a summary of the group's ATO lines
  function groupPack() {
    const c = camp(), mine = atoLines().filter(m => m.group === me.id), hr = "=".repeat(72);
    let out = `${hr}\nGROUP PACK — ${me.name.toUpperCase()}\nOPERATION ${c.opName} — ${c.theater.toUpperCase()}\nGenerated ${zulu()}\nUNCLASSIFIED // EXERCISE — DCS WORLD SIMULATION ONLY\n${hr}\n\n`;
    if (mine.length) out += `YOUR GROUP'S ATO LINES\n` + mine.map(m => `  MSN ${m.msn}  ${m.callsign}  ${m.num}x ${m.type}  ${m.role}  TOT ${m.tot}  ${m.target}  AR ${m.tanker}`).join("\n") + "\n\n";
    released().forEach(([pid, s]) => {
      if (!s.groups.includes(me.id) || !PRODUCTS[pid]) return;
      out += `${hr}\n${htmlToText(renderShared(pid, s))}\n\n`;
      receive(pid, s);
    });
    return out;
  }

  // ---------- render ----------
  function renderHeader() {
    const c = camp(), groups = activeGroups(), lines = atoLines();
    const claimed = lines.filter(l => l.group), open = lines.filter(l => !l.group && l.crew !== "AI").length;
    const sorties = claimed.reduce((s, l) => s + (parseInt(l.num) || 0), 0);
    const rel = released();
    let cells = 0, cur = 0;
    groups.forEach(g => rel.forEach(([pid, s]) => { if (s.groups.includes(g.id)) { cells++; if (Store.received(cid, g.id, pid) >= s.version) cur++; } }));

    document.getElementById("opName").textContent = "OP " + c.opName;
    document.getElementById("meta").innerHTML = `<span>JFACC <b>${c.jfacc ? `${esc(c.jfacc.callsign)} · ${esc(Store.group(c.jfacc.group)?.name || "")}` : "Not named"}</b></span>
      <span>Theater <b>${esc(c.theater)}</b></span><span>Phase <b>${esc(c.phase)}</b></span>
      <span>ATO <b>${AOC.atoId(c.atoDay)}</b> <b>${esc(c.atoPeriod)}</b></span><span>Next event <b>${until(c.nextEvent)}</b></span>`;
    document.getElementById("kpis").innerHTML = [
      [groups.length, `Groups · ${groups.reduce((s, g) => s + (g.members || 0), 0)} pilots`],
      [`${claimed.length} / ${claimed.length + open}`, `Human ATO lines filled${open ? ` · ${open} open` : ""}`],
      [sorties, "Sorties tasked"],
      [rel.length, "Products released"],
      [cells ? Math.round(cur / cells * 100) + "%" : "—", "Distribution current"]
    ].map(([v, l]) => `<div class="panel kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");
  }

  // the campaign package: every group sees the release and what went to DKS; the host (the campaign's JFACC group)
  // also sees its deadlines and the debrief page. Readiness, the mass brief and the mission are the host's alone.
  function renderHost() {
    const c = camp(), el = document.getElementById("hostPanel"), rel = c.packageRelease, PK = AOC.PACKAGE;
    const host = staff || (me && c.jfacc?.group === me.id);
    if (!rel && !host) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    let html = `<div class="panel-head"><div><h2>Campaign package ${rel ? `v${rel.version}` : ""}</h2><div class="muted small">${rel
      ? `Published ${esc(zulu(new Date(rel.when)))} by ${esc(rel.by)} for ATO ${AOC.atoId(rel.atoDay)}: ${rel.current.filter(p => !staffOnly(p.pid)).map(p => `${esc(PRODUCTS[p.pid]?.code)} v${p.v}`).join(", ")}`
        + (c.dks?.overlay || c.dks?.agencies || c.dks?.kneeboard ? `<br>In DKS: ${[c.dks.overlay && `ACO Overlay v${c.dks.overlay.v}`, c.dks.agencies && `Manage Agencies v${c.dks.agencies.v} (${c.dks.agencies.list.length} agencies)`, c.dks.kneeboard && `Kneeboards v${c.dks.kneeboard.v} (SPINS Addendum A)`].filter(Boolean).join(" · ")}` : "")
      : "The CAOC has not published the package yet."}</div></div>
      ${host ? `<div class="toolbar"><a class="btn sm" href="mission-file.html?c=${encodeURIComponent(cid)}">Mission file${c.missionFiles?.length ? ` v${c.missionFiles.length}` : ""}</a><a class="btn sm primary" href="debrief.html?c=${encodeURIComponent(cid)}">Enter mission debrief</a></div>` : ""}</div>`;
    if (host) {
      const ms = PK.milestones(cid, PK.mode(c)).filter(x => (x.owner !== "CAOC" || x.id === "publish") && x.due > Date.now() - 864e5).slice(0, 5);
      html += `<div class="section-h">Your next deadlines (host) and the CAOC PUBLISH</div><ul class="list">${ms.map(x => `<li><span class="dot ${["overdue", "soon"].includes(x.state) ? "warn" : "off"}"></span>
        <div class="grow"><b>${esc(x.label)}</b><div class="muted small">${esc(zulu(x.due))}${x.owner === "GROUPS" ? " · all groups" : ""}</div></div></li>`).join("") || `<li class="muted">No host deadlines coming up.</li>`}</ul>`;
    }
    el.innerHTML = html;
  }

  // the campaign's JFACC group sees the state of every ATO line it requested (filled as units commit on Discord)
  function requestsHtml() {
    if (!me || camp().jfacc?.group !== me.id) return "";
    const waiting = AOC.ATO.lineRequests(cid).filter(r => r.status === "pending").length;
    const notice = waiting ? `<p class="small" style="margin:12px 0 0;color:var(--warn)"><b>${waiting} line request${waiting === 1 ? "" : "s"} from squadrons waiting for you</b> — <a href="ato-request.html">Approve or deny →</a></p>` : "";
    return notice + ownLinesHtml();
  }
  function ownLinesHtml() {
    const ls = AOC.ATO.lines(cid).filter(l => l.requestedBy === me.id && l.status !== "cancelled");
    if (!ls.length) return `<p class="small muted" style="margin:12px 0 0">You haven't requested any ATO lines yet — <a href="ato-request.html">request lines</a>.</p>`;
    const n = s => ls.filter(l => l.status === s).length;
    return `<h3 style="margin:16px 0 6px">Your ATO line requests <span class="muted small" style="font-weight:400">${n("draft") ? `${n("draft")} draft · ` : ""}${n("committed")} filled · ${n("open")} open · ${n("ai")} AI</span>
        <a class="small" href="ato-request.html" style="font-weight:400;margin-left:8px">Manage →</a></h3>
      <div class="table-scroll"><table><thead><tr><th>Msn</th><th>Line</th><th>Crew</th><th>Status</th></tr></thead><tbody>
      ${ls.map(l => `<tr><td class="mono">${esc(l.msn)}</td><td>${l.num}× ${esc(l.airframe)} · ${esc(l.role)}${l.target ? ` · ${esc(l.target)}` : ""}</td><td>${esc(l.crew)}</td>
        <td>${l.status === "committed" ? `<span style="color:var(--ok);font-weight:600">✓ Filled by ${esc(Store.group(l.committedBy)?.name)}</span>`
          : l.status === "open" ? `<span style="color:var(--warn)">Open — posted to ${l.recipients.length} group${l.recipients.length === 1 ? "" : "s"}</span>`
          : l.status === "draft" ? `<span class="muted">Draft — <a href="ato-request.html">post it</a> when it's right</span>` : `<span class="muted">AI — you build it</span>`}</td></tr>`).join("")}
      </tbody></table></div>`;
  }

  function renderGroupPanel() {
    const el = document.getElementById("groupPanel");
    if (!me) {
      el.classList.remove("mine");
      const behind = activeGroups().filter(g => released().some(([pid, s]) => s.groups.includes(g.id) && Store.received(cid, g.id, pid) < s.version));
      el.innerHTML = `<div class="panel-head"><h2>Staff view</h2><a class="btn sm" href="product.html?p=ato&c=${cid}">Edit ATO</a></div>
        <p class="muted" style="margin-top:0">This is the page every participating group sees after signing in. Groups behind on products:</p>
        <ul class="list">${behind.length ? behind.map(g => {
          const missing = released().filter(([pid, s]) => s.groups.includes(g.id) && Store.received(cid, g.id, pid) < s.version).map(([pid]) => PRODUCTS[pid]?.code);
          return `<li><span class="dot warn"></span><div class="grow"><b>${esc(g.name)}</b><div class="muted small">needs ${missing.join(", ")} · liaison ${esc(g.contact)}</div></div></li>`;
        }).join("") : `<li class="muted">Every group holds the current version of every product.</li>`}</ul>`;
      return;
    }
    el.classList.add("mine");
    const mine = atoLines().filter(m => m.group === me.id);
    const updates = released().filter(([pid, s]) => s.groups.includes(me.id) && Store.received(cid, me.id, pid) < s.version);
    el.innerHTML = `<div class="panel-head">
        <div><h2>${esc(me.name)}</h2><div class="muted small">${esc(me.airframes)} · ${me.members || "?"} pilots · ${esc(me.tz || "")} · liaison ${esc(me.contact)}</div></div>
        <button class="btn primary" id="packBtn">Download group pack</button></div>
      <div style="margin-bottom:12px">${updates.length
        ? `<b class="small">${updates.length} update${updates.length > 1 ? "s" : ""} waiting:</b> ` + updates.map(([pid, s]) => {
            const r = Store.received(cid, me.id, pid);
            return `<span class="upd ${r ? "" : "new"}">${PRODUCTS[pid]?.code} ${r ? `v${r}→v${s.version}` : "NEW"}</span>`; }).join(" · ")
        : `<span class="small" style="color:var(--ok)">✓ You hold the current version of every released product.</span>`}</div>
      <div class="table-scroll"><table><thead><tr><th>Msn</th><th>Callsign</th><th>Aircraft</th><th>Mission</th><th>TOT</th><th>Target / area</th><th>AR</th></tr></thead><tbody>
        ${mine.length ? mine.map(m => `<tr><td class="mono">${esc(m.msn)}</td><td><b>${esc(m.callsign)}</b></td><td>${esc(m.num)}× ${esc(m.type)}</td>
          <td>${esc(m.role)}</td><td class="mono">${esc(m.tot)}</td><td>${esc(m.target)}</td><td>${esc(m.tanker)}</td></tr>`).join("")
          : `<tr><td colspan="7" class="muted">No lines on the released ATO.</td></tr>`}
      </tbody></table></div>
      ${requestsHtml()}
      ${camp().packageRelease ? `<div class="dks" style="margin-top:12px">
        <span><b style="color:var(--text)">Pilot package</b> — every released document your aircrew need, as printable pages: the same zip posted to your Discord. The ACO, Comm Plan and SPINS Addendum A are also in DKS.</span>
        <button class="btn sm primary" id="zipBtn">Download pilot package (zip)</button>
      </div>` : ""}`;
    document.getElementById("zipBtn")?.addEventListener("click", async e => { e.target.disabled = true;
      try { const z = await AOC.PACKAGE.downloadZip(cid); Store.log(cid, `${me?.name || "CAOC staff"} downloaded the pilot package`, me?.name); toast(`${z.filename}: ${z.docs.length} documents`); } catch (err) { toast(err.message); }
      e.target.disabled = false; });
    document.getElementById("packBtn").onclick = () => {
      download(`${opFile()}_${me.login}_group_pack.txt`, groupPack());
      Store.log(cid, `${me.name} downloaded group pack`, me.name);
      render();
    };
  }

  function renderBoard() {
    const groups = activeGroups(), rel = Object.fromEntries(released());
    // products the host didn't ask for aren't coming, so they get no "not yet released" tile
    const want = AOC.PACKAGE?.wanted(camp()) || Object.keys(PRODUCTS);
    const ids = Object.keys(PRODUCTS).filter(id => !staffOnly(id) && (rel[id] || want.includes(id))).sort((a, b) => PRODUCTS[a].stage - PRODUCTS[b].stage);
    document.getElementById("board").innerHTML = [...ids.filter(id => rel[id]), ...ids.filter(id => !rel[id])].map(id => {
      const p = PRODUCTS[id], s = rel[id];
      if (!s) return `<div class="tile locked"><span class="code">${p.code}</span><h3>${esc(p.name)}</h3><p>Not yet released</p></div>`;
      const n = groups.filter(g => s.groups.includes(g.id)).length;
      const cur = groups.filter(g => s.groups.includes(g.id) && Store.received(cid, g.id, id) >= s.version).length;
      const mineR = me ? Store.received(cid, me.id, id) : null;
      const flag = me && s.groups.includes(me.id) && mineR < s.version ? `<span class="upd ${mineR ? "" : "new"}">${mineR ? "UPDATED" : "NEW"}</span>` : "";
      return `<div class="tile"><div class="foot"><span class="code">${p.code} · v${s.version}</span>${flag}</div>
        <h3>${esc(p.name)}</h3>
        <div class="muted small">Released ${zulu(new Date(s.when))} by ${esc(s.by)}</div>
        <div class="bar" title="${cur} of ${n} groups current"><i style="width:${n ? cur / n * 100 : 0}%"></i></div>
        <div class="muted small">${cur} / ${n} groups current</div>
        <div class="toolbar"><button class="btn sm" data-view="${id}">View</button><button class="btn sm" data-dl="${id}">Download .txt</button></div></div>`;
    }).join("");
  }

  function renderMatrix() {
    const groups = activeGroups(), rel = released().filter(([pid]) => PRODUCTS[pid]);
    const lines = atoLines();
    if (!rel.length) { document.getElementById("matrix").innerHTML = `<tr><td class="muted">Nothing released for this campaign yet.</td></tr>`; return; }
    document.getElementById("matrix").innerHTML = `<thead><tr><th>Group</th><th>Lines</th>${rel.map(([pid, s]) => `<th>${PRODUCTS[pid].code}<div class="muted" style="font-weight:400">v${s.version}</div></th>`).join("")}</tr></thead>
      <tbody>${groups.map(g => `<tr class="${me && g.id === me.id ? "me" : ""}"><td><b>${esc(g.name)}</b><div class="muted small">${esc(g.airframes)}</div></td>
        <td class="mono">${lines.filter(l => l.group === g.id).length || "—"}</td>
        ${rel.map(([pid, s]) => { const st = cellState(g.id, pid, s); return `<td><span class="cell ${st.cls}">${st.txt}</span></td>`; }).join("")}</tr>`).join("")}</tbody>
      <tfoot><tr><td>Current</td><td class="mono">${lines.filter(l => l.group).length}</td>${rel.map(([pid, s]) => {
        const n = groups.filter(g => s.groups.includes(g.id)), c = n.filter(g => Store.received(cid, g.id, pid) >= s.version);
        return `<td class="mono">${c.length}/${n.length}</td>`; }).join("")}</tr></tfoot>`;
  }

  function renderLines() {
    const lines = atoLines(), ato = camp().shared?.ato;
    document.getElementById("linesTitle").textContent = ato ? `ATO ${AOC.atoId(ato.data.atoDay)} lines by group` : "ATO lines by group";
    document.getElementById("linesSub").textContent = ato ? `From ATO v${ato.version} · products go to the whole group, lines show who flies what` : "";
    if (!lines.length) { document.getElementById("lines").innerHTML = `<p class="muted">No ATO released for this campaign yet.</p>`; return; }
    const lineHtml = m => `<div class="line"><span class="m">${esc(m.msn)}</span>
      <span class="g"><b>${esc(m.callsign)}</b> · ${esc(m.num)}× ${esc(m.type)} · ${esc(m.role)} · ${esc(m.target)}</span><span class="t">${esc(m.tot)}</span></div>`;
    const groups = activeGroups().filter(g => lines.some(l => l.group === g.id))
      .sort((a, b) => (me && a.id === me.id ? -1 : me && b.id === me.id ? 1 : 0));
    const open = lines.filter(l => !l.group && l.crew !== "AI"), ai = lines.filter(l => !l.group && l.crew === "AI");
    document.getElementById("lines").innerHTML = groups.map(g => {
      const ls = lines.filter(l => l.group === g.id);
      return `<div class="gcard ${me && g.id === me.id ? "me" : ""}"><h3>${esc(g.name)}${me && g.id === me.id ? " (you)" : ""}</h3>
        <div class="sub">${esc(g.airframes)} · ${ls.length} line${ls.length > 1 ? "s" : ""} · ${ls.reduce((s, l) => s + (parseInt(l.num) || 0), 0)} sorties</div>${ls.map(lineHtml).join("")}</div>`;
    }).join("") + (open.length ? `<div class="gcard open"><h3>Open lines</h3><div class="sub">Posted on Discord to registered units of that airframe — first to commit flies it</div>
      ${open.map(lineHtml).join("")}</div>` : "")
      + (ai.length ? `<div class="gcard"><h3>AI lines</h3><div class="sub">Built by the sponsor in the .miz — no human crew needed</div>${ai.map(lineHtml).join("")}</div>` : "")
      + activeGroups().filter(g => !lines.some(l => l.group === g.id)).map(g =>
        `<div class="gcard"><h3>${esc(g.name)}</h3><div class="sub">${esc(g.airframes)} · no lines on this ATO (still receives all products)</div></div>`).join("");
  }

  // commitments arriving while the page is open (another tab, or the Discord integration) show up straight away
  window.addEventListener("storage", e => { if (e.key && e.key.startsWith("aoc.db") && !document.querySelector(".modal-back")) location.reload(); });

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.view) viewDoc(b.dataset.view);
    if (b.dataset.dl) {
      const pid = b.dataset.dl, s = camp().shared[pid];
      download(`${opFile()}_${PRODUCTS[pid].code}_v${s.version}.txt`, htmlToText(renderShared(pid, s)));
      receive(pid, s); render();
    }  });

  // a participating squadron (not the host) asks the host for an ATO line: same questions as the host's Create an ATO Line
  function renderAsk() {
    const el = document.getElementById("askPanel"), c = camp(), host = c.jfacc?.group;
    if (!me || !c || host === me.id) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    document.getElementById("unitTargets").innerHTML = (Store.shared(cid, "jiptl")?.data?.rows || []).map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("");
    const mine = AOC.ATO.lineRequests(cid).filter(r => r.gid === me.id).slice().reverse();
    const state = r => r.status === "pending" ? `<span style="color:var(--warn)">Waiting for the host</span>`
      : r.status === "approved" ? `<span style="color:var(--ok);font-weight:600">✓ Approved — line ${esc(AOC.ATO.line(r.lineId)?.msn || "")} is yours</span>`
      : `<span style="color:var(--bad, #e5484d);font-weight:600">Denied</span>${r.reason ? ` · ${esc(r.reason)}` : ""}`;
    el.innerHTML = `<div class="panel-head"><div><h2>Request a line</h2><div class="muted small">Ask the host, ${esc(Store.group(host)?.name || "the host JFACC")}, to add an ATO line for your squadron. They get a Discord post and approve or deny it; an approved line is assigned to you.</div></div></div>
      <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start">
        <div>${AOC.ATO.lineFormHtml({ id: "askForm", submit: "Request a line", targetsList: "unitTargets", defaults: { airframe: String(me.airframes || "").split(/[,;]/)[0].trim() } })}</div>
        <div><div class="section-h" style="margin-top:0">Your requests</div>${mine.length ? `<ul class="list small">${mine.map(r => `<li><div class="grow"><b>${esc(r.fields.num)}× ${esc(r.fields.airframe)}</b> · ${esc(r.fields.role)}${r.fields.tot ? ` · ${esc(r.fields.tot)}` : ""}
          <div>${state(r)}</div><div class="muted">${zulu(new Date(r.at))}</div></div></li>`).join("")}</ul>` : `<p class="muted small">None yet.</p>`}</div></div>`;
    const f = document.getElementById("askForm");
    const rc = () => { const ti = AOC.targetIssue(cid, f.target.value, null, f.role.value);
      document.getElementById("askFormRcpt").innerHTML = (ti ? `<span style="color:var(--warn)">! ${esc(ti)}</span><br>` : "") + `Sent to ${esc(Store.group(host)?.name || "the host")} for approval.`; };
    f.target.addEventListener("input", rc); f.addEventListener("change", rc); rc();
    f.onsubmit = e => { e.preventDefault();
      AOC.ATO.askLine(cid, Object.fromEntries(new FormData(f)), { gid: me.id, user: me.contact });
      toast(`Request sent to ${Store.group(host)?.name || "the host"}`); renderAsk(); };
  }

  function render() { renderHeader(); renderHost(); renderGroupPanel(); renderAsk(); renderBoard(); renderMatrix(); renderLines(); }
  if (!cid) document.querySelector("main").innerHTML = `<div class="panel">Your group isn't assigned to any campaign yet. Contact the AOC.</div>`;
  else render();
</script>
</body>
</html>
