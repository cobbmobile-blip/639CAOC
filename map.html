<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — Theater Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<link rel="stylesheet" href="css/styles.css">
<style>
  .maplay { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; }
  @media (max-width: 1000px) { .maplay { grid-template-columns: 1fr; } }
  #map { height: calc(100vh - 230px); min-height: 460px; border-radius: var(--radius); border: 1px solid var(--line); }
  .side { max-height: calc(100vh - 230px); overflow: auto; }
  .tools { display: flex; flex-wrap: wrap; gap: 6px; }
  .tools button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .item { border-top: 1px solid var(--line); padding: 8px 0; display: grid; gap: 6px; }
  .item .top { display: flex; gap: 8px; align-items: center; }
  .item .top input { flex: 1; padding: 5px 8px; font-size: 13px; font-weight: 600; }
  .item .meta { display: flex; gap: 6px; flex-wrap: wrap; }
  .item .meta select { padding: 4px 6px; font-size: 12px; flex: 1; }
  .item .attrs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .item .attrs label { margin: 0; font-size: 10.5px; }
  .item .attrs input { padding: 4px 6px; font-size: 12px; }
  .item .coord { font: 11.5px var(--mono); color: var(--muted); }
  .item textarea { min-height: 34px; font-size: 12px; padding: 5px 8px; }
  .item.sel { background: var(--panel-2); outline: 1px solid var(--accent); }
  .tag { font: 600 10px var(--mono); letter-spacing: .06em; padding: 2px 6px; border-radius: 3px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line); }
  .ico { width: 22px; height: 22px; display: grid; place-items: center; font: 700 10px var(--mono); color: #000; border: 2px solid #000; flex: none; }
  .sect { font: 600 11px var(--mono); letter-spacing: .1em; color: var(--accent); text-transform: uppercase; margin: 14px 0 2px; display: flex; justify-content: space-between; gap: 8px; }
  .hintbar { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; min-height: 18px; }
  .leaflet-container { font-family: var(--font); }
  .pt-icon { background: none; border: 0; }
  .pt-icon .ico { box-shadow: 0 0 0 2px rgba(255,255,255,.8); }
  .pt-label { background: rgba(0,0,0,.7); color: #fff; border: 0; box-shadow: none; font: 600 11px var(--mono); padding: 1px 5px; }
  .pt-label::before { display: none; }
  /* FLOT / FSCL end labels: text along the line, light halo so it reads on any map */
  .line-lbl { background: none; border: 0; }
  .line-lbl div { position: absolute; white-space: nowrap; text-align: center; font: 700 12px/1.15 Arial, sans-serif; letter-spacing: .04em;
    text-shadow: 0 0 2px #fff, 0 0 2px #fff, 0 0 3px #fff; pointer-events: none; }
  .line-lbl .under { display: block; font-size: 10px; font-weight: 600; margin-top: 7px; }
  .end-handle { background: #fff; border: 2px solid #000; border-radius: 50%; }
  .name-pop .leaflet-popup-content-wrapper { background: var(--panel); color: var(--text); border: 1px solid var(--accent); border-radius: 8px; }
  .name-pop .leaflet-popup-tip { background: var(--accent); }
  .name-pop .leaflet-popup-content { margin: 10px 12px; }
  .np-t { font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  .np-row { display: flex; gap: 6px; }
  .np-in { padding: 5px 8px; font-size: 13px; font-weight: 600; }

  /* right-click menu */
  .ctx { position: absolute; z-index: 1000; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: var(--shadow); min-width: 230px; padding: 6px 0; font-size: 13px; }
  .ctx .h { font: 600 10.5px var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; padding: 6px 12px 2px; }
  .ctx .h:first-child { color: var(--accent); }
  .ctx button { display: flex; width: 100%; gap: 8px; align-items: center; background: none; border: 0; color: inherit; font: inherit; padding: 5px 12px; cursor: pointer; text-align: left; }
  .ctx button:hover { background: var(--panel-2); }
  .ctx .sw { width: 14px; height: 14px; border: 2px solid #000; flex: none; }
  .ctx .ln { width: 16px; height: 0; border-top: 3px solid; flex: none; }
</style>
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>AOC.Auth.require();</script>
<script src="js/products.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>

<main class="wrap">
  <div class="panel-head" style="margin-bottom:12px">
    <div>
      <a class="small" id="back" href="#">← ACO</a>
      <h1 style="margin-top:4px" id="title">Theater map</h1>
      <div class="muted small" id="sub"></div>
    </div>
    <div class="toolbar">
      <span class="small" id="saveState"></span>
      <button class="btn" id="geojson">Download GeoJSON</button>
      <button class="btn" disabled title="DKS integration coming soon — points go to Waypoints / Nav points / Spider points, shapes to Overlay">Export to DKS</button>
      <button class="btn primary" id="save">Save map</button>
    </div>
  </div>

  <div class="maplay">
    <section>
      <div class="panel" style="padding:10px">
        <div class="tools" id="tools"></div>
        <div class="hintbar" id="hint"></div>
      </div>
      <div id="map" style="margin-top:10px"></div>
    </section>
    <aside class="panel side">
      <div class="panel-head"><h2>Map items</h2><span class="muted small" id="counts"></span></div>
      <div id="missing"></div>
      <div id="list"></div>
    </aside>
  </div>
</main>

<datalist id="freqs"></datalist>

<script>
  const { Store, esc, toast } = AOC;
  AOC.renderChrome();
  const cid = new URLSearchParams(location.search).get("c") || Store.currentCampaignId();
  const campaign = Store.campaign(cid);
  document.getElementById("back").href = `product.html?p=aco&c=${encodeURIComponent(cid)}`;
  document.getElementById("title").textContent = `Theater map · OP ${campaign.opName}`;
  document.getElementById("sub").textContent = `${campaign.theater} · Points, control measures and overlays — valid for the whole campaign`;
  const DEFAULT_HINT = "Right-click the map to add anything at that spot, or pick a point type and click. The left-edge tools draw plain boxes, circles, polygons and lines.";

  // Point types and the DKS section each will export to (Nav / Spider points are confirmed; the rest TBC).
  // Waypoints, IPs, targets and bullseye are not made here — they're built in DKS.
  const POINT_TYPES = {
    "NAV POINT":    { code: "NP", label: "Nav point", plural: "Nav points", color: "#4ea8ff", dks: "Nav points" },
    "SPIDER POINT": { code: "SP", label: "Spider point", plural: "Spider points", color: "#f2d14b", dks: "Spider points" },
    "DEST POINT":   { code: "DP", label: "Dest point", plural: "Destination points", color: "#3fbfbf", dks: "Destination points (TBC)" },
    "THREAT":       { code: "TH", label: "Threat", plural: "Threats", color: "#f28c28", dks: "Overlay (TBC)" }
  };

  // DCS air-defence systems with an approximate max engagement range (NM) for the threat ring.
  // Starting values only — DCS versions and mission settings vary, so the ring stays editable per threat.
  const THREAT_SYSTEMS = [
    ["Long range", [["SA-5 Gammon (S-200)", 130], ["SA-10 Grumble (S-300PS)", 40], ["Patriot", 54]]],
    ["Medium range", [["SA-2 Guideline (S-75)", 22], ["SA-11 Gadfly (Buk)", 19], ["SA-6 Gainful (Kub)", 13], ["SA-3 Goa (S-125)", 13],
      ["HQ-7", 8], ["Hawk", 24], ["NASAMS", 15]]],
    ["Short range", [["SA-15 Gauntlet (Tor)", 6.5], ["SA-8 Gecko (Osa)", 5.5], ["SA-19 Grison (Tunguska)", 4.3], ["SA-13 Gopher (Strela-10)", 2.7],
      ["SA-9 Gaskin (Strela-1)", 2.3], ["Roland", 4.3], ["Rapier", 3.6], ["Chaparral", 4.5], ["Avenger", 2.3]]],
    ["MANPADS / AAA", [["SA-18 Grouse (Igla)", 2.8], ["Stinger MANPADS", 2.6], ["ZSU-23-4 Shilka", 1.3], ["ZU-23-2", 1.3], ["Gepard", 2.2], ["S-60 57mm", 3.2]]]
  ];
  const THREAT_RANGE = Object.fromEntries(THREAT_SYSTEMS.flatMap(([, list]) => list));
  const SHAPE_COLORS = { RED: "#e5534b", BLUE: "#4ea8ff", YELLOW: "#f2d14b", GREEN: "#3fbf7f", PURPLE: "#a371f7", ORANGE: "#f28c28", WHITE: "#ffffff", BLACK: "#111111" };
  const KIND_LABEL = { rectangle: "Box", circle: "Circle", polygon: "Polygon", polyline: "Line", track: "Racetrack", anchor: "AR track" };

  // Control-measure types. draw: polyline | polygon | track (two-click racetrack). All export to the DKS Overlay.
  const ALT = [["altLo", "Floor"], ["altHi", "Ceiling"]];
  const SHAPE_TYPES = {
    // Doctrinal line graphics (MIL-STD-2525 / ADP 1-02): FLOT = friendly line with semicircles toward the enemy, "FLOT" at both ends;
    // FSCL = solid black line, "FSCL" with establishing HQ and effective DTG at both ends.
    "FLOT":         { label: "FLOT", group: "Lines", draw: "polyline", color: "BLUE", weight: 2.5, name: "FLOT", fields: [["time", "Effective DTG"], ["flip", "Scallops"]] },
    "FSCL":         { label: "FSCL", group: "Lines", draw: "polyline", color: "BLACK", weight: 3, name: "FSCL", fields: [["hq", "Establishing HQ"], ["time", "Effective DTG"]] },
    "MRR":          { label: "MRR corridor", group: "Lines", draw: "polyline", color: "BLUE", weight: 3, dash: "6 6", name: "MRR", fields: [["width", "Width (NM)"], ...ALT, ["time", "Effective"]] },
    // AR track (FAA JO 7610.14 ch.5): left-hand racetrack anchored at the ARCP, legs normally 50 NM long and 20 NM apart,
    // receivers enter at the ARIP (uptrack, within 30° of the extended centreline), tankers at the ARCP; plus entry/exit points.
    "TANKER TRACK": { label: "Tanker track", group: "Tracks & orbits", draw: "anchor", color: "BLUE", name: "AR TRACK",
      fields: [["length", "Length (NM)"], ["width", "Width (NM)"], ["heading", "Refuel leg (°T)"], ["aripOn", "ARIP"], ...ALT, ["callsign", "Tanker"], ["freq", "Freq"]] },
    "HVAA ORBIT":   { label: "HVAA orbit", group: "Tracks & orbits", draw: "track", color: "PURPLE", name: "ORBIT", width: 15, fields: [["width", "Width (NM)"], ...ALT, ["callsign", "Asset"], ["freq", "Freq"]] },
    "ARTY ROZ":     { label: "Artillery ROZ", group: "Areas", draw: "polygon", color: "ORANGE", name: "ARTY ROZ", fields: [["altLo", "Floor"], ["maxord", "MAXORD (ft)"], ["unit", "Firing unit"], ["time", "Effective"]] }
  };
  const THEATERS = {
    "Caucasus": [42.2, 42.6, 8], "Syria": [35.0, 37.5, 7], "Persian Gulf": [26.3, 55.5, 7], "Sinai": [30.0, 33.0, 7],
    "Kola": [68.5, 33.5, 6], "Marianas": [15.0, 145.6, 8], "Afghanistan": [31.5, 65.0, 7], "Iraq": [33.0, 44.0, 6],
    "South Atlantic": [-51.7, -59.0, 7], "Nevada": [36.5, -115.5, 8], "Normandy": [49.2, -0.5, 8], "Channel": [50.8, 1.5, 8],
    "Germany (Cold War)": [50.5, 10.0, 7]
  };

  // ---------- data ----------
  let data = structuredClone(Store.content(cid, "map") || { points: [], shapes: [] });
  data.points = data.points || []; data.shapes = data.shapes || [];
  // older maps may still hold waypoints; they become nav points so nothing is lost
  data.points.forEach(p => { if (!POINT_TYPES[p.type]) p.type = "NAV POINT"; });
  const acoMeasures = (Store.content(cid, "aco")?.measures || []).map(m => m.name).filter(Boolean);
  // Comm Plan channels feed the tanker / HVAA frequency boxes
  document.getElementById("freqs").innerHTML = AOC.COMM.channels(Store.content(cid, "acp")?.matrix)
    .filter(c => c.freq).map(c => `<option value="${esc(c.freq)}">${esc(c.id)} ${esc(c.callsign || c.role)}</option>`).join("");
  let dirty = false, selected = null, placing = null, pendingType = null;
  const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  function markDirty() { dirty = true; const st = document.getElementById("saveState"); st.textContent = "Unsaved changes"; st.style.color = "var(--warn)"; }

  // DCS-style degrees + decimal minutes, e.g. N42°11.420' E042°39.610'
  function ddm(lat, lng) {
    const f = (v, pos, neg, w) => { const a = Math.abs(v), d = Math.floor(a), m = (a - d) * 60;
      return `${v >= 0 ? pos : neg}${String(d).padStart(w, "0")}°${m.toFixed(3).padStart(6, "0")}'`; };
    return `${f(lat, "N", "S", 2)} ${f(lng, "E", "W", 3)}`;
  }
  // Racetrack outline around the line A→B, width in NM (local flat-earth approximation, fine at theater scale)
  function racetrack([a, b], widthNM) {
    const lat0 = (a[0] + b[0]) / 2, kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110540;
    const P = ll => [(ll[1] - a[1]) * kx, (ll[0] - a[0]) * ky], Q = ([x, y]) => [a[0] + y / ky, a[1] + x / kx];
    const A = P(a), B = P(b), len = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
    const u = [(B[0] - A[0]) / len, (B[1] - A[1]) / len], n = [-u[1], u[0]], r = (+widthNM || 10) * 1852 / 2, out = [];
    const arc = (C, s) => { for (let i = 0; i <= 16; i++) { const t = Math.PI * i / 16;
      out.push(Q([C[0] + r * (s * Math.cos(t) * n[0] + s * Math.sin(t) * u[0]), C[1] + r * (s * Math.cos(t) * n[1] + s * Math.sin(t) * u[1])])); } };
    arc(B, 1); arc(A, -1);
    return out;
  }

  // ---------- AR track geometry, in a frame aligned with the refuelling leg ----------
  // a = NM along the leg from the ARCP, c = NM to the LEFT of it (left-hand orbit sits on the left)
  const NM = 1852;
  function fromFrame([lat0, lng0], hdg, a, c) {
    const h = hdg * Math.PI / 180, e = (a * Math.sin(h) - c * Math.cos(h)) * NM, n = (a * Math.cos(h) + c * Math.sin(h)) * NM;
    return [lat0 + n / 110540, lng0 + e / (111320 * Math.cos(lat0 * Math.PI / 180))];
  }
  function toFrame([lat0, lng0], hdg, [lat, lng]) {
    const h = hdg * Math.PI / 180, e = (lng - lng0) * 111320 * Math.cos(lat0 * Math.PI / 180), n = (lat - lat0) * 110540;
    return { a: (e * Math.sin(h) + n * Math.cos(h)) / NM, c: (-e * Math.cos(h) + n * Math.sin(h)) / NM };
  }
  const bearing = ([la1, lo1], [la2, lo2]) => {
    const e = (lo2 - lo1) * Math.cos((la1 + la2) / 2 * Math.PI / 180), n = la2 - la1;
    return (Math.atan2(e, n) * 180 / Math.PI + 360) % 360;
  };
  // entry / exit are relative to the ARCP; the ARIP (optional) is relative to the ENTRY — about 10 NM before it
  const AR_DEFAULTS = { length: "50", width: "20", rel: { entry: { a: -10, c: 20 }, exit: { a: 65, c: 0 }, arip: { a: -10, c: 0 } } };
  const AR_POINT_DEFS = [["arip", "ARIP", "#3fbf7f"], ["arcp", "ARCP", "#ffffff"], ["entry", "ENTRY", "#f2d14b"], ["exit", "EXIT", "#e5534b"]];
  const hasArip = s => s.aripOn !== "No";
  const arPoints = s => AR_POINT_DEFS.filter(([k]) => k !== "arip" || hasArip(s));
  function anchorGeom(s) {
    const L = +s.length || 50, W = +s.width || 20, h = +s.heading || 0, r = W / 2, A = s.arcp, out = [];
    for (let i = 0; i <= 16; i++) { const t = Math.PI * i / 16; out.push(fromFrame(A, h, L + r * Math.sin(t), r - r * Math.cos(t))); }   // far turn
    for (let i = 0; i <= 16; i++) { const t = Math.PI * i / 16; out.push(fromFrame(A, h, -r * Math.sin(t), r + r * Math.cos(t))); }   // near turn
    const rel = { ...AR_DEFAULTS.rel, ...(s.rel || {}) };
    const pt = ({ a, c }) => fromFrame(A, h, a, c);
    return { outline: out, legEnd: fromFrame(A, h, L, 0), arcp: A, entry: pt(rel.entry), exit: pt(rel.exit),
      arip: pt({ a: rel.entry.a + rel.arip.a, c: rel.entry.c + rel.arip.c }), rel };
  }
  const aripDist = s => { const { rel } = anchorGeom(s); return Math.hypot(rel.arip.a, rel.arip.c); };

  // ---------- map ----------
  const [clat, clng, cz] = THEATERS[campaign.theater] || [42.2, 42.6, 7];
  const map = L.map("map", { zoomControl: true }).setView([clat, clng], cz);
  const base = {
    "Topographic": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", { maxZoom: 17, attribution: "© OpenTopoMap, © OpenStreetMap contributors" }),
    "Street": L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap contributors" }),
    "Satellite": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { maxZoom: 18, attribution: "Imagery © Esri" })
  };
  base["Topographic"].addTo(map);
  L.control.layers(base, null, { position: "topright" }).addTo(map);
  L.control.scale({ imperial: true, metric: false }).addTo(map);

  const shapeLayer = new L.FeatureGroup().addTo(map);   // editable by the draw toolbar
  const trackLayer = L.layerGroup().addTo(map);          // racetracks: edited by dragging their end handles
  const pointLayer = L.layerGroup().addTo(map);
  const layers = {}; // id -> leaflet layer

  map.addControl(new L.Control.Draw({
    position: "topleft",
    draw: {
      rectangle: { showArea: false, shapeOptions: { color: SHAPE_COLORS.RED } }, // showArea off avoids a Leaflet.draw bug with Leaflet 1.9
      circle: { shapeOptions: { color: SHAPE_COLORS.YELLOW }, feet: false, nautic: true },
      polygon: { shapeOptions: { color: SHAPE_COLORS.GREEN } },
      polyline: { shapeOptions: { color: SHAPE_COLORS.BLUE }, nautic: true },
      marker: false, circlemarker: false
    },
    edit: { featureGroup: shapeLayer }
  }));

  // ---------- naming on the map ----------
  // small popup with a name box; Enter or Save applies it, Esc closes
  // threats can also pick their DCS system in the same popup
  const systemSelect = (cur, attrs = "") => `<select ${attrs}><option value="">DCS system…</option>${THREAT_SYSTEMS.map(([g, list]) =>
    `<optgroup label="${esc(g)}">${list.map(([n, r]) => `<option value="${esc(n)}" ${n === cur ? "selected" : ""}>${esc(n)} — ${r} NM</option>`).join("")}</optgroup>`).join("")}</select>`;
  function namePopup(latlng, title, current, onSave, opts = {}) {
    const pop = L.popup({ closeButton: false, className: "name-pop", offset: [0, -8], minWidth: 240 })
      .setLatLng(latlng)
      .setContent(`<div class="np-t">${esc(title)}</div>
        ${opts.threat ? `<div style="margin-bottom:6px">${systemSelect(opts.system, 'class="np-sys" style="padding:4px 6px;font-size:12px"')}</div>` : ""}
        <div class="np-row"><input class="np-in" value="${esc(current || "")}" placeholder="Name">
        <button class="btn sm primary np-ok">Save</button></div>`)
      .openOn(map);
    const el = pop.getElement(), inp = el.querySelector(".np-in"), sys = el.querySelector(".np-sys");
    const apply = () => { onSave(inp.value.trim(), sys ? sys.value : undefined); map.closePopup(pop); };
    el.querySelector(".np-ok").onclick = apply;
    inp.addEventListener("keydown", e => { if (e.key === "Enter") apply(); if (e.key === "Escape") map.closePopup(pop); });
    L.DomEvent.disableClickPropagation(el);
    setTimeout(() => { inp.focus(); inp.select(); }, 0);
  }
  function renamePoint(p) {
    namePopup([p.lat, p.lng], `Name this ${POINT_TYPES[p.type].label.toLowerCase()}`, p.name, (v, system) => {
      if (v) p.name = v;
      if (system !== undefined && system !== (p.system || "")) setSystem(p, system);
      updatePoint(p); markDirty(); renderList();
    }, { threat: p.type === "THREAT", system: p.system });
  }

  // ---------- threat rings ----------
  const rings = {}; // point id -> L.circle
  const pointLabel = p => p.type === "THREAT" && p.system ? `${p.name} · ${p.system.split(" (")[0]} ${p.range || "?"} NM` : p.name;
  function setSystem(p, system) {
    // picking a system sets its default ring; a hand-typed range is kept only if no system default exists
    p.system = system || "";
    if (system && THREAT_RANGE[system] != null) p.range = String(THREAT_RANGE[system]);
  }
  function updateRing(p) {
    const want = p.type === "THREAT" && +p.range > 0;
    if (!want) { if (rings[p.id]) { pointLayer.removeLayer(rings[p.id]); delete rings[p.id]; } return; }
    // bright red so the ring reads on topo, street and satellite tiles alike
    const style = { radius: +p.range * 1852, color: "#ff1f1f", weight: 2.5, opacity: .95, dashArray: "10 6", fillColor: "#ff1f1f", fillOpacity: .12, interactive: false };
    if (rings[p.id]) rings[p.id].setLatLng([p.lat, p.lng]).setRadius(style.radius);
    else rings[p.id] = L.circle([p.lat, p.lng], style).addTo(pointLayer);
  }
  function updatePoint(p) { const m = layers[p.id]; m.setIcon(pointIcon(p)); m.setTooltipContent(pointLabel(p)); updateRing(p); }

  // ---------- points ----------
  function pointIcon(p) {
    const t = POINT_TYPES[p.type] || POINT_TYPES["NAV POINT"];
    const shape = p.type === "THREAT" ? "border-radius:50%" : p.type === "SPIDER POINT" ? "transform:rotate(45deg)" : "";
    return L.divIcon({ className: "pt-icon", iconSize: [22, 22], iconAnchor: [11, 11],
      html: `<div class="ico" style="background:${t.color};${shape}"><span style="${p.type === "SPIDER POINT" ? "transform:rotate(-45deg)" : ""}">${t.code}</span></div>` });
  }
  function addPointLayer(p) {
    const m = L.marker([p.lat, p.lng], { icon: pointIcon(p), draggable: true })
      .bindTooltip(pointLabel(p), { permanent: true, direction: "right", offset: [12, 0], className: "pt-label" })

  // semicircles (~14 px across) along the line, bulging to the enemy side: left of drawing direction, or right when flipped

        : `<input data-s="${s.id}" data-k="${k}" value="${esc(s[k])}" ${k === "freq" ? 'list="freqs"' : ""} placeholder="${k === "maxord" ? "e.g. 18,000" : k.startsWith("alt") ? "e.g. FL220" : ""}">`}</div>`).join("")}</div>` : ""}
      <div class="coord">${shapeCoord(s)}</div>
      <textarea data-s="${s.id}" data-k="notes" placeholder="Notes">${esc(s.notes)}</textarea></div>`;
  }
  function renderList() {
    const byType = Object.keys(POINT_TYPES).map(t => [t, data.points.filter(p => p.type === t)]).filter(([, ps]) => ps.length);
    document.getElementById("counts").textContent = `${data.points.length} points · ${data.shapes.length} shapes`;
    const drawn = new Set(data.shapes.map(s => s.aco).filter(Boolean));
    const undrawn = acoMeasures.filter(n => !drawn.has(n));
    document.getElementById("missing").innerHTML = undrawn.length
      ? `<p class="small" style="color:var(--warn);margin-top:0">ACO measures not on the map yet: ${undrawn.map(esc).join(", ")}. Draw a shape and link it.</p>` : "";
    const measures = data.shapes.filter(s => s.type), plain = data.shapes.filter(s => !s.type);
    document.getElementById("list").innerHTML =
      byType.map(([t, ps]) => `<div class="sect"><span>${esc(POINT_TYPES[t].plural)}</span><span class="muted">→ DKS ${esc(POINT_TYPES[t].dks)}</span></div>` + ps.map(p => `
        <div class="item ${p.id === selected ? "sel" : ""}" data-item="${p.id}">
          <div class="top"><span class="ico" style="background:${POINT_TYPES[p.type].color}">${POINT_TYPES[p.type].code}</span>
            <input data-p="${p.id}" data-k="name" value="${esc(p.name)}">
            <button class="btn sm ghost" data-zoom="${p.id}" title="Zoom to">⌖</button><button class="btn sm ghost danger" data-del="${p.id}" title="Delete">✕</button></div>
          <div class="meta"><select data-p="${p.id}" data-k="type">${Object.keys(POINT_TYPES).map(x => `<option ${x === p.type ? "selected" : ""}>${x}</option>`).join("")}</select>
            <input data-p="${p.id}" data-k="elev" value="${esc(p.elev)}" placeholder="Elev (ft)" style="width:90px;padding:4px 6px;font-size:12px"></div>
          ${p.type === "THREAT" ? `<div class="attrs" style="grid-template-columns:1fr 90px">
            <div><label>DCS system</label>${systemSelect(p.system, `data-p="${p.id}" data-k="system" style="padding:4px 6px;font-size:12px"`)}</div>
            <div><label>Ring (NM)</label><input data-p="${p.id}" data-k="range" value="${esc(p.range)}" placeholder="NM"></div></div>` : ""}
          <div class="coord">${ddm(p.lat, p.lng)}</div>
          <textarea data-p="${p.id}" data-k="notes" placeholder="Notes">${esc(p.notes)}</textarea></div>`).join("")).join("")
      + (measures.length ? `<div class="sect"><span>Control measures</span><span class="muted">→ DKS Overlay</span></div>` + measures.map(shapeItem).join("") : "")
      + (plain.length ? `<div class="sect"><span>Overlay shapes</span><span class="muted">→ DKS Overlay</span></div>` + plain.map(shapeItem).join("") : "")
      + (!data.points.length && !data.shapes.length ? `<p class="muted">Nothing on the map yet. Right-click the map to add something.</p>` : "");
  }
  const list = document.getElementById("list");
  list.addEventListener("input", e => {
    const t = e.target, k = t.dataset.k; if (!k) return;
    if (t.dataset.p) {
      const p = data.points.find(x => x.id === t.dataset.p);
      if (k === "system") { setSystem(p, t.value); renderList(); } else p[k] = t.value;
      if (["name", "type", "system", "range"].includes(k)) updatePoint(p);
      if (k === "type") renderList();
    } else {
      const s = data.shapes.find(x => x.id === t.dataset.s); s[k] = t.value;
      // linking a still-default-named shape to an ACO measure adopts the measure's name
      if (k === "aco" && t.value && /^(BOX|CIRCLE|POLYGON|LINE|RACETRACK|AR TRACK|FLOT|FSCL|MRR|ORBIT|ARTY ROZ)( \d+)?$/.test(s.name)) { s.name = t.value; renderList(); }
      const geomKey = ["color", "width", "length", "heading", "aripOn"].includes(k);
      if (geomKey) { redrawShape(s); showHandles(); }
      else layers[s.id].setTooltipContent(shapeLabel(s));
      if (DECORATED.includes(s.type)) decorate(s);
      if (k === "color" || k === "aco") renderList();
      if (geomKey && k !== "color") document.querySelector(`[data-item="${s.id}"] .coord`).innerHTML = shapeCoord(s);
    }
    markDirty();
  });
  list.addEventListener("click", e => {
    const fl = e.target.closest("[data-flip]")?.dataset.flip;
    if (fl) { const s = data.shapes.find(x => x.id === fl); s.flip = s.flip === "Flipped" ? "" : "Flipped"; decorate(s); markDirty(); renderList(); return; }
    const z = e.target.closest("[data-zoom]")?.dataset.zoom, d = e.target.closest("[data-del]")?.dataset.del;
    if (z) { const l = layers[z]; l.getBounds ? map.fitBounds(l.getBounds(), { maxZoom: 11, padding: [40, 40] }) : map.setView(l.getLatLng(), Math.max(map.getZoom(), 10)); select(z); }
    if (d) {
      const l = layers[d]; pointLayer.removeLayer(l); shapeLayer.removeLayer(l); trackLayer.removeLayer(l); delete layers[d];
      if (rings[d]) { pointLayer.removeLayer(rings[d]); delete rings[d]; }
      if (decor[d]) { decorLayer.removeLayer(decor[d]); delete decor[d]; }
      data.points = data.points.filter(x => x.id !== d); data.shapes = data.shapes.filter(x => x.id !== d);
      markDirty(); renderList();
    }
  });

  // ---------- save & export ----------
  document.getElementById("save").onclick = () => {
    Store.setContent(cid, "map", structuredClone(data));
    Store.log(cid, `Theater map saved (${data.points.length} points, ${data.shapes.length} shapes)`);
    dirty = false;
    const st = document.getElementById("saveState"); st.textContent = "Saved"; st.style.color = "var(--ok)";
    toast("Map saved");
  };
  document.getElementById("geojson").onclick = () => {
    const attrs = s => Object.fromEntries((SHAPE_TYPES[s.type]?.fields || []).map(([k]) => [k, s[k] || null]));
    const lnglat = ([a, b]) => [b, a];
    const features = [
      ...data.points.map(p => ({ type: "Feature", geometry: { type: "Point", coordinates: [p.lng, p.lat] },
        properties: { name: p.name, kind: "point", pointType: p.type, dksSection: POINT_TYPES[p.type].dks, elevation: p.elev || null,
          ...(p.type === "THREAT" ? { threatSystem: p.system || null, ringNM: +p.range || null } : {}), notes: p.notes } })),
      // AR tracks: the racetrack outline, with ARIP / ARCP / ENTRY / EXIT as named coordinates
      ...data.shapes.filter(s => s.kind === "anchor").map(s => { const g = anchorGeom(s);
        return { type: "Feature", geometry: { type: "Polygon", coordinates: [[...g.outline, g.outline[0]].map(lnglat)] },
          properties: { name: s.name, kind: "arTrack", measureType: s.type, color: s.color, acoMeasure: s.aco || null, dksSection: "Overlay",
            ...attrs(s), pattern: "left-hand racetrack", ...Object.fromEntries(AR_POINT_DEFS.map(([k, lab]) => [k, k === "arip" && !hasArip(s) ? null
              : { name: s.names?.[k] || lab, coordinates: lnglat(g[k]) }])), notes: s.notes } }; }),
      ...data.shapes.filter(s => s.kind !== "anchor").map(s => ({ type: "Feature",
        geometry: s.kind === "circle" ? { type: "Point", coordinates: [s.lng, s.lat] }
          : s.kind === "polyline" || s.kind === "track" ? { type: "LineString", coordinates: s.latlngs.map(([a, b]) => [b, a]) }
          : { type: "Polygon", coordinates: [[...s.latlngs, s.latlngs[0]].map(([a, b]) => [b, a])] },
        properties: { name: s.name, kind: s.kind, measureType: s.type || null, radiusMeters: s.radius || null, color: s.color,
          acoMeasure: s.aco || null, dksSection: "Overlay", ...attrs(s), notes: s.notes } }))
    ];
    AOC.download(`${campaign.opName.replace(/\s+/g, "_")}_theater_map.geojson`, JSON.stringify({ type: "FeatureCollection", features }, null, 2), "application/geo+json");
  };
  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  data.points.forEach(addPointLayer);
  data.shapes.forEach(addShapeLayer);
  renderList();
  // open on the area where the campaign's items are, not the whole theater
  const all = L.featureGroup([...Object.values(layers)]);
  if (data.points.length + data.shapes.length) map.fitBounds(all.getBounds(), { padding: [30, 30], maxZoom: 10 });
</script>
</body>
</html>
