<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — ATO Line Requests</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .alay { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
  @media (max-width: 1050px) { .alay { grid-template-columns: minmax(0, 1fr); } }
  .alay > * { min-width: 0; }
  .ft td, .ft th { font-size: 12.5px; white-space: nowrap; }
  .ft td input, .ft td select { padding: 3px 6px; font-size: 12px; }
  .ft td input[type=checkbox] { width: auto; }
  .crew { font: 600 10.5px var(--mono); padding: 2px 6px; border-radius: 3px; border: 1px solid currentColor; }
  .crew.Human { color: var(--accent); } .crew.AI { color: var(--muted); }
  .st { font: 600 10.5px var(--mono); text-transform: uppercase; letter-spacing: .05em; }
  .st.open { color: var(--warn); } .st.committed { color: var(--ok); } .st.ai, .st.cancelled { color: var(--muted); }
  .rcpt { font-size: 12px; color: var(--muted); margin-top: 6px; }
  /* Discord post preview (generic look — the real post comes from the existing bot) */
  .dpost { background: #313338; color: #dbdee1; border-radius: 8px; padding: 14px; font: 14px/1.4 "Segoe UI", system-ui, sans-serif; }
  .dpost .who { font-weight: 600; color: #fff; } .dpost .who small { color: #949ba4; font-weight: 400; margin-left: 6px; }
  .dpost .emb { border-left: 4px solid #5865f2; background: #2b2d31; border-radius: 4px; padding: 10px 12px; margin-top: 8px; }
  .dpost .emb h4 { margin: 0 0 6px; color: #fff; font-size: 15px; }
  .dpost .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px; }
  .dpost .grid b { display: block; color: #fff; font-size: 12px; }
  .dpost .cbtn { display: inline-block; margin-top: 10px; background: #248046; color: #fff; border-radius: 4px; padding: 6px 16px; font-weight: 600; font-size: 14px; }
  .sim { border-top: 1px dashed var(--line); margin-top: 12px; padding-top: 10px; }
  pre.json { background: var(--bg-2); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font-size: 11.5px; max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>AOC.UnitAuth.require();</script>
<script src="js/products.js"></script>
<script src="js/ato.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/miz.js"></script>

<main class="wrap">
  <section class="campaign-head">
    <div>
      <div class="op" id="who"></div>
      <h1 id="title">ATO line requests</h1>
      <div class="campaign-meta" id="meta"></div>
    </div>
    <div class="campaign-select"><label for="campaign">Campaign</label><select id="campaign"></select></div>
  </section>

  <div id="body"></div>
</main>

<datalist id="targets"></datalist>

<script>
  const { Store, UnitAuth, esc, toast, zulu, ATO } = AOC;
  AOC.renderChrome({ unit: true });
  const me = UnitAuth.group();
  document.getElementById("who").textContent = `Group JFACC / LNO · ${me.name}`;

  // only the campaign's sponsoring group (its JFACC / LNO) requests lines
  const mine = Store.db.campaigns.filter(c => c.jfacc?.group === me.id);
  let cid = mine[0]?.id, miz = null, previewId = null;
  const sel = document.getElementById("campaign");
  sel.innerHTML = mine.map(c => `<option value="${c.id}">OP ${esc(c.opName)} — ${esc(c.theater)}</option>`).join("");
  sel.onchange = () => { cid = sel.value; miz = null; render(); };

  const camp = () => Store.campaign(cid);
  const recipientsText = airframe => { const r = ATO.recipients(airframe);
    return r.length ? `Posts to ${r.length} registered group${r.length > 1 ? "s" : ""}: ${r.map(g => esc(g.name)).join(", ")}` : `<span style="color:var(--bad)">No registered group flies ${esc(airframe)} — nobody would get this post.</span>`; };
  const opt = (list, cur) => list.map(x => `<option ${x === cur ? "selected" : ""}>${esc(x)}</option>`).join("");

  function render() {
    const body = document.getElementById("body");
    if (!cid) {
      body.innerHTML = `<div class="panel"><h2>No campaigns to request for</h2><p class="muted">ATO lines are requested by a campaign's Group JFACC / LNO. ${esc(me.name)} isn't the JFACC group for any campaign. Committing to lines other groups request happens through the Discord post.</p></div>`;
      return;
    }
    const c = camp();
    document.getElementById("title").textContent = `ATO line requests · OP ${c.opName}`;
    document.getElementById("meta").innerHTML = `<span>JFACC <b>${esc(c.jfacc.callsign)}</b></span><span>ATO Day <b>${c.atoDay || "—"}</b></span><span>Theater <b>${esc(c.theater)}</b></span>`;
    document.getElementById("targets").innerHTML = (Store.content(cid, "jiptl")?.rows || []).map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("");
    body.innerHTML = `<div class="alay">
      <div class="grid" style="align-content:start">
        <section class="panel">
          <div class="panel-head"><div><h2>From your .miz</h2><div class="muted small">Load your group's mission file: player slots become <b>Human</b> lines, the rest <b>AI</b>. Tick the flights to request.</div></div>
            <div class="toolbar">${AOC.MIZ.current(cid) ? `<button class="btn primary" id="hostMiz">Use mission file v${AOC.MIZ.current(cid).v}</button>` : `<a class="btn" href="mission-file.html?c=${encodeURIComponent(cid)}">Send your mission file…</a>`}
            <label class="btn" style="margin:0;text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">Load another .miz…<input type="file" id="mizIn" accept=".miz,.zip" hidden></label></div></div>
          <div id="miz"></div>
        </section>
        <section class="panel">
          <div class="panel-head"><h2>Your ATO lines</h2><span class="muted small" id="lineCount"></span></div>
          <div class="table-scroll" id="lines"></div>
        </section>
      </div>
      <section class="panel">
        <div class="panel-head"><h2>Request a line</h2></div>
        <form id="reqForm">
          <div class="row2">
            <div class="field"><label>Airframe</label><select name="airframe">${opt(ATO.AIRFRAMES, "F-15E")}</select></div>
            <div class="field"><label>Aircraft</label><select name="num">${opt(["1", "2", "3", "4"], "4")}</select></div>
          </div>
          <div class="row2">
            <div class="field"><label>Mission</label><select name="role">${opt(ATO.ROLES, "Strike")}</select></div>
            <div class="field"><label>Crew</label><select name="crew"><option>Human</option><option>AI</option></select></div>
          </div>
          <div class="row2">
            <div class="field"><label>TOT / on-station</label><input name="tot" placeholder="e.g. 0720Z or 0600–1000Z"></div>
            <div class="field"><label>Target / area</label><input name="target" list="targets" placeholder="JIPTL # or area"></div>
          </div>
          <div class="row2">
            <div class="field"><label>Package</label><input name="pkg" placeholder="e.g. A"></div>
            <div class="field"><label>Callsign (if set)</label><input name="callsign" placeholder="from your .miz"></div>
          </div>
          <div class="row2">
            <div class="field"><label>Base / start</label><input name="base" placeholder="e.g. Kobuleti, ramp"></div>
            <div class="field"><label>Commit by</label><input name="commitBy" placeholder="e.g. 211800Z OCT 26"></div>
          </div>
          <div class="field"><label>Notes for the committing unit</label><textarea name="notes" style="min-height:56px"></textarea></div>
          <div class="rcpt" id="rcpt"></div>
          <button class="btn primary" type="submit" style="margin-top:10px">Request ATO line</button>
        </form>
      </section>
    </div>`;
    const f = document.getElementById("reqForm");
    const upd = () => { document.getElementById("rcpt").innerHTML = f.crew.value === "AI" ? "AI line — goes straight onto the ATO; your group builds it in the .miz. Nothing is posted." : recipientsText(f.airframe.value); };
    f.addEventListener("change", upd); upd();
    f.onsubmit = e => {
      e.preventDefault();
      const l = ATO.request(cid, Object.fromEntries(new FormData(f)), { gid: me.id, user: camp().jfacc.callsign });
      toast(l.status === "open" ? `Line ${l.msn} posted to ${l.recipients.length} groups` : `AI line ${l.msn} added to the ATO`);
      f.reset(); upd(); renderLines(); renderMiz();
    };
    // the version the CAOC already has (mission-file.html) — the usual source for line requests
    const hm = document.getElementById("hostMiz");
    if (hm) hm.onclick = () => { const cur = AOC.MIZ.current(cid);
      miz = { name: `${cur.name} (mission file v${cur.v})`, theatre: cur.theatre, date: cur.date, flights: structuredClone(cur.flights), redFlights: 0 };
      toast(`Mission file v${cur.v}: ${miz.flights.length} BLUE flights`); renderMiz(); };
    document.getElementById("mizIn").onchange = async e => {
      const file = e.target.files[0]; if (!file) return;
      try { miz = { name: file.name, ...(await ATO.readMiz(file)) }; toast(`${file.name}: ${miz.flights.length} BLUE flights`); }
      catch (err) { toast(`Couldn't read ${file.name}: ${err.message}`); miz = null; }
      e.target.value = ""; renderMiz();
    };
    renderMiz(); renderLines();
  }

  function renderMiz() {
    const el = document.getElementById("miz"); if (!el) return;
    if (!miz) { el.innerHTML = `<p class="muted small" style="margin:0">No mission loaded. Try <a href="samples/iron_trident_viper.miz" download>the sample .miz</a>.</p>`; return; }
    const done = new Map(ATO.lines(cid).filter(l => l.status !== "cancelled" && l.mizGroup).map(l => [l.mizGroup, l]));
    el.innerHTML = `<div class="muted small" style="margin-bottom:8px">${esc(miz.name)} · ${esc(miz.theatre)} ${esc(miz.date)} · ${miz.flights.length} BLUE flights${miz.redFlights ? ` · ${miz.redFlights} RED (ignored)` : ""}</div>
      <div class="table-scroll"><table class="ft"><thead><tr><th></th><th>Flight</th><th>Airframe</th><th>#</th><th>Crew</th><th>Mission</th><th>TOT</th><th>Target</th><th>Start</th></tr></thead><tbody>
      ${miz.flights.map((fl, i) => { const d = done.get(fl.group);
        return `<tr>
        <td>${d ? "" : `<input type="checkbox" data-pick="${i}" ${fl.crew === "Human" ? "checked" : ""}>`}</td>
        <td><b>${esc(fl.group)}</b><div class="muted small">${esc(fl.callsign)}</div></td>
        <td>${esc(fl.airframe)}</td><td>${fl.num}</td><td><span class="crew ${fl.crew}">${fl.crew}</span></td>
        <td>${d ? esc(d.role) : `<select data-f="role" data-i="${i}">${opt(ATO.ROLES, fl.role || "Strike")}</select>`}</td>
        <td>${d ? esc(d.tot) : `<input data-f="tot" data-i="${i}" placeholder="TOT" style="width:90px">`}</td>
        <td>${d ? esc(d.target) : `<input data-f="target" data-i="${i}" list="targets" placeholder="JIPTL #" style="width:90px">`}</td>
        <td class="muted">${d ? `<span class="st ${d.status}">${esc(d.msn)} ${ATO.STATUS[d.status][0].split(" —")[0]}</span>` : esc(fl.start)}</td></tr>`; }).join("")}
      </tbody></table></div>
      <div class="toolbar" style="margin-top:8px"><button class="btn primary" id="reqMiz">Request ticked flights</button><span class="muted small">Human flights are posted for commitment; AI flights go straight on the ATO.</span></div>`;
    el.querySelectorAll("[data-f]").forEach(x => x.addEventListener("input", () => { miz.flights[+x.dataset.i]["_" + x.dataset.f] = x.value; }));
    document.getElementById("reqMiz").onclick = () => {
      const picks = [...el.querySelectorAll("[data-pick]:checked")].map(x => miz.flights[+x.dataset.pick]);
      if (!picks.length) { toast("Tick at least one flight"); return; }
      const made = picks.map(fl => ATO.request(cid, { airframe: fl.airframe, num: fl.num, role: fl._role || fl.role || "Strike", crew: fl.crew,
        tot: fl._tot, target: fl._target, callsign: fl.callsign, base: fl.start, source: miz.name, mizGroup: fl.group }, { gid: me.id, user: camp().jfacc.callsign }));
      toast(`${made.length} line${made.length > 1 ? "s" : ""} requested — ${made.filter(l => l.status === "open").length} posted for commitment`);
      renderMiz(); renderLines();
    };
  }

  function renderLines() {
    const el = document.getElementById("lines"); if (!el) return;
    const ls = ATO.lines(cid).filter(l => l.requestedBy === me.id && l.status !== "cancelled");
    const n = s => ls.filter(l => l.status === s).length;
    document.getElementById("lineCount").textContent = `${n("committed")} committed · ${n("open")} open · ${n("ai")} AI`;
    el.innerHTML = ls.length ? `<table class="ft"><thead><tr><th>Msn</th><th>Line</th><th>Crew</th><th>Status</th><th></th></tr></thead><tbody>
      ${ls.map(l => { const g = Store.group(l.committedBy);
        return `<tr><td class="mono">${esc(l.msn)}</td>
        <td><b>${l.num}× ${esc(l.airframe)}</b> · ${esc(l.role)}<div class="muted small">${[l.callsign, l.tot && `TOT ${l.tot}`, l.target, l.pkg && `Pkg ${l.pkg}`].filter(Boolean).map(esc).join(" · ")}</div></td>
        <td><span class="crew ${l.crew}">${l.crew}</span></td>
        <td><span class="st ${l.status}">${ATO.STATUS[l.status][0]}</span>
          <div class="muted small">${l.status === "committed" ? `<b style="color:var(--ok)">${esc(g?.name)}</b> · ${esc(l.committedByUser)} · ${zulu(new Date(l.committedAt))}`
            : l.status === "open" ? `Posted to ${l.recipients.length} group${l.recipients.length === 1 ? "" : "s"} · ${zulu(new Date(l.postedAt))}` : ""}</div></td>
        <td style="text-align:right">${l.status !== "ai" ? `<button class="btn sm" data-preview="${l.id}">Discord post</button>` : ""}
          ${l.status === "open" || l.status === "ai" ? `<button class="btn sm ghost danger" data-cancel="${l.id}">Cancel</button>` : ""}
          ${l.status === "committed" ? `<button class="btn sm ghost" data-release="${l.id}" title="Free the line and post it again">Release</button>` : ""}</td></tr>`; }).join("")}
      </tbody></table>` : `<p class="muted">No lines requested yet.</p>`;
  }

  // what the bot posts, plus a demo stand-in for the Commit button press
  function preview(id) {
    const l = ATO.line(id), c = camp(), p = ATO.discordPayload(l);
    document.querySelector(".modal-back")?.remove();
    const back = document.createElement("div"); back.className = "modal-back";
    back.innerHTML = `<div class="panel modal" style="max-width:640px;max-height:calc(100vh - 32px);overflow:auto">
      <div class="panel-head"><h2>Discord post · line ${esc(l.msn)}</h2><button class="btn sm" data-x>Close</button></div>
      <p class="muted small" style="margin-top:0">Preview of what the existing CAOC bot posts to each registered ${esc(l.airframe)} group. The live post goes out through that integration.</p>
      <div class="dpost"><span class="who">CAOC Tasking<small>BOT · ATO Day ${c.atoDay}</small></span>
        <div class="emb"><h4>ATO LINE ${esc(l.msn)} — ${l.num}× ${esc(l.airframe)} · ${esc(l.role)}</h4>
          <div class="grid">
            <div><b>Operation</b>OP ${esc(c.opName)}</div><div><b>TOT</b>${esc(l.tot || "TBD")}</div><div><b>Target / area</b>${esc(l.target || "TBD")}</div>
            <div><b>Crew</b>${esc(l.crew)}</div><div><b>Package</b>${esc(l.pkg || "—")}</div><div><b>Base</b>${esc(l.base || "—")}</div>
            <div><b>Requested by</b>${esc(Store.group(l.requestedBy)?.name)} (JFACC ${esc(l.requestedByUser)})</div><div><b>Commit by</b>${esc(l.commitBy || "—")}</div><div><b>Callsign</b>${esc(l.callsign || "TBD")}</div>
          </div>${l.notes ? `<div style="margin-top:6px;font-size:13px">${esc(l.notes)}</div>` : ""}
          ${l.status === "committed" ? `<div style="margin-top:8px;color:#57f287;font-weight:600">✓ Filled by ${esc(Store.group(l.committedBy)?.name)}</div>` : `<span class="cbtn">Commit</span>`}
        </div></div>
      <div class="rcpt">Posted to: ${l.recipients.map(g => esc(Store.group(g)?.name)).join(", ") || "nobody — no registered group flies this airframe"}</div>
      ${l.status === "open" ? `<div class="sim"><b class="small">Demo:</b> <span class="muted small">stand in for a unit pressing Commit (the bot calls the same commit endpoint).</span>
        <div class="toolbar" style="margin-top:8px">${l.recipients.map(g => `<button class="btn sm" data-commit="${g}">Commit as ${esc(Store.group(g)?.name)}</button>`).join("")}</div></div>` : ""}
      <details style="margin-top:12px"><summary class="small">Payload sent to the bot</summary><pre class="json">${esc(JSON.stringify(p, null, 2))}</pre></details></div>`;
    document.body.appendChild(back); previewId = id;
    back.onclick = e => {
      if (e.target === back || e.target.closest("[data-x]")) { back.remove(); previewId = null; return; }
      const g = e.target.closest("[data-commit]")?.dataset.commit; if (!g) return;
      const r = ATO.commit(id, g, Store.group(g).contact);
      toast(r.ok ? `${Store.group(g).name} committed to line ${l.msn}` : `Commit rejected: ${r.error}`);
      renderLines(); renderMiz(); preview(id);
    };
  }

  document.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.preview) preview(b.dataset.preview);
    if (b.dataset.cancel && confirm("Cancel this ATO line? It comes off the ATO and the Discord post is closed.")) { ATO.cancel(b.dataset.cancel); renderLines(); renderMiz(); }
    if (b.dataset.release && confirm("Release this commitment and post the line again?")) { ATO.release(b.dataset.release); renderLines(); renderMiz(); }
  });
  // a commit arriving from another tab/window (e.g. the integration) updates this page straight away
  window.addEventListener("storage", e => { if (e.key && e.key.startsWith("aoc.db")) { location.reload(); } });

  render();
</script>
</body>
</html>
