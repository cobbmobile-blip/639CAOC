<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — Product Builder</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>AOC.Auth.require();</script>
<script src="js/products.js"></script>
<script src="js/pr.js"></script>
<script src="js/jceoi-data.js"></script>
<script src="js/jceoi.js"></script>
<script src="js/iff.js"></script>
<script src="js/ato.js"></script>
<script src="js/miz.js"></script>
<script src="js/tdl.js"></script>

<main class="wrap">
  <div class="panel-head no-print" style="margin-bottom:16px">
    <div>
      <a href="index.html" class="small">← Dashboard</a>
      <h1 id="title" style="margin-top:4px"></h1>
      <div class="muted small" id="sub"></div>
      <div id="commsStrip"></div>
      <div class="small" id="released" style="color:var(--ok)"></div>
      <div class="small" id="approvalNote" style="color:var(--accent)"></div>
    </div>
    <div class="toolbar">
      <a class="btn hidden" id="mapBtn" href="#" title="Points, nav/spider points and overlay shapes for this campaign">Theater map →</a>
      <a class="btn hidden" id="nomBtn" href="#" title="Build the JIPTL from the REDFOR order of battle, AO (Area of Operations) and key-task priorities">Target nomination →</a>
      <span class="badge" id="status"></span>
      <button class="btn" id="save" title="Saved products are ready for the CFACC, who approves them here or in PUBLISH">Save</button>
      <button class="btn" id="approve">Approve</button>
    </div>
  </div>


  <div class="builder">
    <section class="panel">
      <div class="panel-head"><h2>Build</h2>
        <div class="toolbar"><button class="btn sm ghost" id="clear">Clear form</button></div>
      </div>
      <form id="form" onsubmit="return false"></form>
    </section>
    <section class="sticky-preview">
      <div class="panel">
        <div class="panel-head no-print"><h2>Preview</h2><div class="seg hidden" id="docTabs" role="group" aria-label="Document"></div>
          <div class="toolbar">
            <button class="btn sm" id="copy">Copy text</button>
            <button class="btn sm" id="txt">Download .txt</button>
            <button class="btn sm" id="json">Download .json</button>
            <button class="btn sm" id="print">Print / PDF</button>
          </div>
        </div>
        <article class="doc" id="doc"></article>
      </div>
    </section>
  </div>
</main>

<datalist id="jiptlList"></datalist>
<datalist id="msnList"></datalist>

<script>
  const { Store, esc, PRODUCTS, STATUS_LABEL, toast } = AOC;
  AOC.renderChrome();

  const qs = new URLSearchParams(location.search);
  const pid = qs.get("p"), cid = qs.get("c") || Store.currentCampaignId();
  const P = PRODUCTS[pid];
  if (!P) { location.replace("index.html"); throw new Error("unknown product"); }
  const campaign = Store.campaign(cid);
  const user = AOC.Auth.user();
  const ctx = { campaign, user, group: id => Store.group(id) };

  document.title = `Virtual AOC — ${P.code}`;
  document.getElementById("title").textContent = P.name.startsWith(P.code) ? P.name : `${P.code} · ${P.name}`;
  if (AOC.COMMS.products.includes(pid)) document.getElementById("commsStrip").innerHTML = AOC.COMMS.strip(cid, pid);
  document.getElementById("sub").textContent = `OP ${campaign.opName} · ${campaign.theater} · owner: ${P.owner}`;
  if (P.mapLink) {
    const mb = document.getElementById("mapBtn");
    mb.href = `map.html?c=${encodeURIComponent(cid)}`; mb.classList.remove("hidden");
  }
  if (P.nomination) {
    const nb = document.getElementById("nomBtn");
    nb.href = `targeting.html?c=${encodeURIComponent(cid)}`; nb.classList.remove("hidden");
  }
  // products built on their own page (TDP book, MAAP): this page keeps the preview and the approval workflow
  if (P.page) {
    const nb = document.getElementById("nomBtn");
    nb.href = `${P.page.href}?c=${encodeURIComponent(cid)}`; nb.textContent = `${P.page.label} →`; nb.classList.remove("hidden");
  }
  // Products with a comm matrix need the full width (their DKS export goes out with PUBLISH on the Dashboard)
  if (P.fields.some(f => f.type === "matrix")) document.querySelector(".builder").style.gridTemplateColumns = "minmax(0, 1fr)";

  // working copy of the product data
  let data = structuredClone(Store.content(cid, pid) || {});
  P.fields.forEach(f => {
    if (f.type === "table" || f.type === "list") data[f.key] = data[f.key] || [];
    if (pid === "ato" || pid === "aod") { if (f.key === "atoDay" && !data.atoDay) data.atoDay = String(campaign.atoDay || 1); }
    // SPINS starts its IFF section from the JCEOI IFF plan
    if (pid === "spins" && AOC.IFF) { if (f.key === "mode4" && !data.mode4) data.mode4 = AOC.IFF.data.mode4.default; if (f.key === "iffProc" && !data.iffProc) data.iffProc = AOC.IFF.data.mode4.procedures; }
    // ... and takes the bullseye from the BLUE bullseye of the host's current mission file, whenever there is one
    if (pid === "spins" && f.key === "bullseye" && AOC.MIZ && AOC.PR) { const b = AOC.MIZ.bullseye(cid);
      if (b) { data.bullseye = `${AOC.PR.ddm(b.lat, b.lon)} (${AOC.PR.mgrs(b.lat, b.lon)})`; data.bullseyeSrc = `host mission file v${b.v}`; } }
  });

  // JIPTL target IDs feed TDP and ATO target fields
  const jiptl = Store.content(cid, "jiptl")?.rows || [];
  document.getElementById("jiptlList").innerHTML = jiptl.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("");
  // ATO missions feed the Comm Plan and BDA/MISREP mission fields
  const atoMsns = Store.content(cid, "ato")?.missions || [];
  document.getElementById("msnList").innerHTML = atoMsns.map(m => `<option value="${esc(m.msn)}">${esc(m.callsign)} · ${esc(m.role)}</option>`).join("");

  // Request banner (when arriving via "Fulfil")
  // ---------- form building ----------
  const form = document.getElementById("form");

  // a select's options (a list, or a function for lists loaded by later scripts); a saved value off the list stays selectable
  function optionsHtml(f, val, row) {
    const os = typeof f.options === "function" ? f.options(data, cid, row) : f.options, v = String(val ?? "");
    return `<option></option>${[...(v && !os.includes(v) ? [v] : []), ...os].map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}`;
  }
  function cellInput(col, val, path, row) {
    // "2xF-16C": one cell for the row's num and type
    if (col.type === "acft") return `<input data-acft="${path.replace(/\.[^.]+$/, "")}" value="${esc(row.num || row.type ? `${row.num || ""}x${row.type || ""}` : "")}" placeholder="2xF-16C">`;
    const a = `data-path="${path}"`;
    if (col.type === "select") return `<select ${a}>${optionsHtml(col, val, row)}</select>`;
    if (col.type === "groups") return `<select ${a}><option></option>${campaign.groups.map(g => `<option value="${g}" ${g === val ? "selected" : ""}>${esc(Store.group(g).name)}</option>`).join("")}</select>`;
    if (col.type === "jiptl") return `<input ${a} list="jiptlList" value="${esc(val)}">`;
    if (col.type === "msn") return `<input ${a} list="msnList" value="${esc(val)}">`;
    return `<input ${a} value="${esc(val)}">`;
  }

  function buildForm() {
    let html = "", halfOpen = false;
    const closeHalf = () => { if (halfOpen) { html += "</div>"; halfOpen = false; } };
    P.fields.forEach(f => {
      if (f.type === "section") { closeHalf(); html += `<div class="section-h">${esc(f.label)}</div>`; if (pid === "optasklink" && AOC.TDL) html += tdlPanel(); return; }
      if (f.half && !halfOpen) { html += `<div class="row2">`; halfOpen = true; }
      else if (!f.half) closeHalf();
      if (f.prefill && f.type === "table") { const p = f.prefill(data, cid); if (p && (data[f.key] || []).length < p.length) data[f.key] = p; }
      const v = data[f.key] ?? "", h = typeof f.hint === "function" ? f.hint(data, cid) : f.hint;
      const hint = h ? `<div class="hint">${esc(h)}</div>` : "";
      if (f.type === "textarea") html += `<div class="field"><label>${esc(f.label)}</label><textarea data-path="${f.key}">${esc(v)}</textarea>${hint}</div>`;
      else if (f.type === "list") html += `<div class="field list-edit"><label>${esc(f.label)}</label>
        ${v.map((item, i) => `<div class="item"><input data-path="${f.key}.${i}" value="${esc(item)}"><button class="btn sm ghost" data-del="${f.key}.${i}" title="Remove">✕</button></div>`).join("")}
        <button class="btn sm" data-add="${f.key}">+ Add</button></div>`;
      else if (f.type === "table") html += `<div class="field"><label>${esc(f.label)}</label><div class="grid-edit"><table>
        <thead><tr>${f.rank ? "<th>#</th>" : ""}${f.columns.map(c => `<th style="${c.w ? `width:${c.w}px` : ""}">${esc(c.label)}</th>`).join("")}<th></th></tr></thead>
        <tbody>${v.map((row, i) => [row, i]).filter(([row]) => !f.show || f.show(row, Store.group)).map(([row, i]) => `<tr>${f.rank ? `<td class="mono small" style="padding:8px">${i + 1}</td>` : ""}
          ${f.columns.map(c => `<td>${cellInput(c, row[c.key] ?? "", `${f.key}.${i}.${c.key}`, row)}</td>`).join("")}
          <td class="rowact">${f.rank ? `<button data-up="${f.key}.${i}" title="Move up">↑</button><button data-down="${f.key}.${i}" title="Move down">↓</button>` : ""}
          <button data-del="${f.key}.${i}" title="Delete row">✕</button></td></tr>`).join("")}</tbody></table></div>
        <button class="btn sm" data-add="${f.key}" data-fi="${P.fields.indexOf(f)}" style="margin-top:6px">+ Add row</button>${hint}</div>`;
      else if (f.type === "matrix") html += matrixEditor(f);
      else if (f.type === "measures") html += measuresEditor(f);
      else if (f.type === "checklist") html += checklistEditor(f);
      else if (f.type === "select") html += `<div class="field"><label>${esc(f.label)}</label><select data-path="${f.key}">${optionsHtml(f, v)}</select>${hint}</div>`;
      else if (f.type === "jiptl") html +=`<div class="field"><label>${esc(f.label)}</label><input data-path="${f.key}" list="jiptlList" value="${esc(v)}">${hint}</div>`;
      else html += `<div class="field"><label>${esc(f.label)}</label><input data-path="${f.key}" value="${esc(v)}">${hint}</div>`;
      if (f.iffPanel) html += `<div id="tgtCheck">${tgtCheckHtml()}</div>`;
      if (f.iffPanel && AOC.IFF) html += iffPanel();
    });
    closeHalf();
    if (P.page && !P.fields.length) html = `<p class="muted">This product is built on its own page. Use it to edit; saving there makes it ready for the CFACC. PUBLISH on the Dashboard approves and releases it.</p>
      <a class="btn primary" href="${P.page.href}?c=${encodeURIComponent(cid)}">${esc(P.page.label)} →</a>`;
    if ((pid === "spins" || pid === "acp") && AOC.COMM.commIssues) html = `<div id="commCheck">${commCheckHtml()}</div>` + html;
    form.innerHTML = html;
  }

  // ---------- IFF on the ATO: Mode 3/A follows Mode 1, assign buttons, live checks ----------
  function iffPanel() {
    const s = AOC.IFF.settings(cid);
    return `<div class="field"><label>IFF / SIF</label>
      <div class="hint">Mode 3/A starts with the line's Mode 1 code (SEAD 30 → 3011–3017, 3021–3027 …): lead BBC1, last member BBC1 + n − 1.</div>
      <div><label class="check-row"><input type="checkbox" data-iffset="rotateMode1" ${s.rotateMode1 ? "checked" : ""}> Rotate Mode 1 sub-role digit each ATO day</label>
        <label class="check-row"><input type="checkbox" data-iffset="mode2" ${s.mode2 ? "checked" : ""}> Mode 2 per airframe (full-IFF modules only)</label></div>
      <div class="hint">Codes are assigned on every save: lines with none, or a Mode 3/A that no longer follows its Mode 1.</div>
      <div class="toolbar"><button class="btn sm ghost" data-iffact="all">Reassign all lines</button></div>
      <div id="iffCheck">${iffCheckHtml()}</div></div>`;
  }
  // ATO lines whose target number is no longer on the JIPTL, and INT lines with no JIPTL target at all
  function tgtCheckHtml() {
    const bad = (data.missions || []).map(m => [m, AOC.targetIssue(cid, m.target, null, m.role)]).filter(([, t]) => t);
    return bad.length ? `<div class="field"><label>Targets</label><ul class="small" style="list-style:none;padding-left:0;margin:0">${bad.map(([m, t]) =>
      `<li style="color:var(--warn)">! <span class="mono">${esc(m.msn)}</span> ${esc(t)}</li>`).join("")}</ul></div>` : "";
  }
  function iffCheckHtml() {
    const fs = AOC.IFF.check(cid, data.missions || [], AOC.JCEOI?.theaterKey(campaign.theater)), n = k => fs.filter(f => f.sev === k).length;
    return `<p class="small">${fs.length ? `${n("error")} error${n("error") === 1 ? "" : "s"} · ${n("warn")} warning${n("warn") === 1 ? "" : "s"} · ${n("info")} note${n("info") === 1 ? "" : "s"}` : `<span style="color:var(--ok)">✓ IFF codes valid, unique and clear of reserved codes.</span>`}</p>
      ${fs.length ? `<ul class="small" style="list-style:none;padding-left:0;margin:0">${fs.slice(0, 40).map(f => `<li style="color:${f.sev === "error" ? "var(--danger, #e5484d)" : f.sev === "warn" ? "var(--warn)" : "var(--muted)"}">${f.sev === "error" ? "✕" : f.sev === "warn" ? "!" : "·"} <span class="mono">${esc(f.msn)}</span> ${esc(f.text)}</li>`).join("")}</ul>` : ""}`;
  }
  form.addEventListener("change", e => {
    const k = e.target.dataset.iffset; if (!k) return;
    const c = Store.campaign(cid); c.iff = c.iff || {};
    c.iff[k] = e.target.checked;
    Store.save(); buildForm(); renderDoc();
  });

  // ---------- OPTASKLINK: rebuilt from the ATO and the latest mission file every time it opens ----------
  let tdlRebuilt = false;
  if (pid === "optasklink" && AOC.TDL) { const b = AOC.TDL.build(cid, data); tdlRebuilt = JSON.stringify(b) !== JSON.stringify(data); data = b; }
  function tdlPanel() {
    const mf = AOC.MIZ.current(cid), m = data.miz, n = k => (data[k] || []).length;
    return `<div class="field">
      <p class="small">${m ? `Mission file ${esc(m.from)}: ${m.c2.length} C2 / donor, ${m.ai.length} AI aircraft, ${m.hornet.length} F/A-18C.` : `No host mission file${mf && !mf.tdl ? ` with datalinks yet (v${mf.v} was sent before they were read — have the host send it again)` : " yet"}.`}
        ATO: ${n("viper")} F-16C, ${n("sadl")} A-10C, ${n("idm")} AH-64D.
        STN blocks ${esc(AOC.TDL.blocks(cid).join(", "))}.${tdlRebuilt ? ` <span style="color:var(--warn)">Updated from the ATO / mission file — save and submit.</span>` : ""}</p>
      <div class="toolbar"><button class="btn sm ghost" data-tdlact="all" title="Every number is assigned again; normally lines keep theirs">Reassign every number</button></div>
      <div id="tdlCheck">${tdlCheckHtml()}</div></div>`;
  }
  function tdlCheckHtml() {
    const fs = AOC.TDL.check(cid, data), n = k => fs.filter(f => f.sev === k).length;
    return `<p class="small">${n("error") + n("warn") ? `${n("error")} error${n("error") === 1 ? "" : "s"} · ${n("warn")} warning${n("warn") === 1 ? "" : "s"} · ${n("info")} note${n("info") === 1 ? "" : "s"}` : `<span style="color:var(--ok)">✓ STNs unique and valid; network settings agree.</span>`}</p>
      ${fs.length ? `<ul class="small" style="list-style:none;padding-left:0;margin:0">${fs.slice(0, 50).map(f => `<li style="color:${f.sev === "error" ? "var(--danger, #e5484d)" : f.sev === "warn" ? "var(--warn)" : "var(--muted)"}">${f.sev === "error" ? "✕" : f.sev === "warn" ? "!" : "·"} ${esc(f.text)}</li>`).join("")}</ul>` : ""}`;
  }

  // ---------- ROE measures (SPINS & ROE): the standing catalogue from the JCEOI data, on/off per campaign ----------
  function measuresEditor(f) {
    const R = window.AOC_JCEOI?.roe; if (!R) return `<div class="field"><label>${esc(f.label)}</label><p class="small muted">The standing ROE did not load.</p></div>`;
    data[f.key] = data[f.key] || {};
    const aew = (Store.content(cid, "ato")?.missions || []).find(m => m.role === "AEW")?.callsign || "the AWACS";
    let html = `<div class="field"><label>${esc(f.label)}</label>`, last = null;
    R.measures.forEach(m => {
      if (m.group !== last) { html += `<div class="section-h" style="margin:10px 0 4px">${esc(m.group)}</div>`; last = m.group; }
      html += `<label class="check-row" style="align-items:flex-start;padding:3px 0"><input type="checkbox" data-path="${f.key}.${m.id}" ${(data[f.key][m.id] ?? m.on) ? "checked" : ""} style="width:auto;margin-top:3px">
        <span style="font-size:13.5px">${esc(m.text.replace("{awacs}", aew))}</span></label>`;
    });
    return html + `<div class="hint">Defaults come from the vCAOC standing ROE (JCEOI data); untick what this campaign doesn't allow.</div></div>`;
  }

  // ---------- checklist editor: [{ section, item, done, notes }], seeded from the schema's item list ----------
  function checklistEditor(f) {
    if (!data[f.key]?.length) data[f.key] = f.items.flatMap(([section, items]) => items.map(item => ({ section, item, done: false, notes: "" })));
    const list = data[f.key], done = list.filter(x => x.done).length;
    let html = `<div class="field"><label>${esc(f.label)} — ${done} / ${list.length} covered</label>`, last = null;
    list.forEach((x, i) => {
      if (x.section !== last) { html += `<div class="section-h" style="margin:14px 0 6px">${esc(x.section)}</div>`; last = x.section; }
      html += `<div style="display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:4px 0;border-top:1px solid var(--line)">
        <input type="checkbox" data-path="${f.key}.${i}.done" ${x.done ? "checked" : ""} style="width:auto">
        <span style="font-size:13.5px">${esc(x.item)}</span>
        <input data-path="${f.key}.${i}.notes" value="${esc(x.notes)}" placeholder="Decision / notes" style="padding:4px 8px;font-size:12.5px"></div>`;
    });
    return html + `</div>`;
  }

  // ---------- comm matrix editor: one coloured column per net, channels numbered top-down ----------
  const { COLORS: MX_COLORS, cellStyle, blankMatrix } = AOC.COMM;
  function normalizeMatrix(key) {
    const m = data[key] = data[key] || blankMatrix(campaign.theater);
    m.columns.forEach(c => { c.cells = c.cells || []; while (c.cells.length < m.rows) c.cells.push({}); });
    return m;
  }
  function matrixEditor(f) {
    const m = normalizeMatrix(f.key), k = f.key;
    return `<div class="field"><label>${esc(f.label)}</label><div class="mx-edit">
      ${m.columns.map((c, ci) => `<div class="mx-col" style="${cellStyle(c.color)}">
        <div class="mx-h">
          <input data-path="${k}.columns.${ci}.title" value="${esc(c.title)}" placeholder="Net name" title="Net name, e.g. TANKERS">
          <select data-path="${k}.columns.${ci}.color" title="Column colour">${Object.keys(MX_COLORS).map(n => `<option ${n === c.color ? "selected" : ""}>${n}</option>`).join("")}</select>
          <button class="btn sm" data-mx="delcol" data-i="${ci}" title="Remove this column">Remove column</button>
        </div>
        ${Array.from({ length: m.rows }, (_, r) => { const p = `${k}.columns.${ci}.cells.${r}`, x = c.cells[r];
          return `<div class="mx-cell"><span class="id">${esc(c.color)} ${r + 1}</span>
            <input data-path="${p}.role" value="${esc(x.role)}" placeholder="Role (e.g. TAC COORD)">
            <input class="cs" data-path="${p}.callsign" value="${esc(x.callsign)}" placeholder="CALLSIGN">
            <input data-path="${p}.freq" value="${esc(x.freq)}" placeholder="Freq (e.g. 290.050)"></div>`; }).join("")}
      </div>`).join("")}
    </div>
    <div class="mx-tools"><button class="btn sm" data-mx="addcol" data-k="${k}">+ Column</button>
      <button class="btn sm" data-mx="addrow" data-k="${k}">+ Row</button>
      <button class="btn sm" data-mx="delrow" data-k="${k}" ${m.rows <= 1 ? "disabled" : ""}>− Last row</button></div>
    <div class="hint">Each cell is a channel named by colour and row — e.g. RAZOR (TAC COORD) is WHITE 1.</div>
    ${AOC.JCEOI ? `${(() => { const nt = AOC.JCEOI.plan(AOC.JCEOI.theaterKey(campaign.theater)) ? "NTTR plan" : "JCEOI plan"; return `<div class="mx-tools"><button class="btn sm" data-mx="jceoiFill" data-k="${k}" title="Put the ${nt} frequency in every empty channel">Fill empty from ${nt}</button>
      <button class="btn sm ghost" data-mx="jceoiReset" data-k="${k}" title="Replace the whole matrix with the ${nt}">Reset to ${nt}</button>`; })()}
      <a class="btn sm ghost" href="jceoi.html" target="_blank" rel="noopener">Open JCEOI →</a></div><div id="jceoiCheck">${jceoiCheck(m)}</div>` : ""}</div>`;
  }
  // every channel against the campaign theater's JCEOI register: documented frequencies within one channel are flagged
  // disconnects between the SPINS, the JCEOI, the Comm Plan and the products that read it (products.js commIssues)
  function commCheckHtml() {
    const xs = AOC.COMM.commIssues(cid), col = { bad: "var(--danger, #e5484d)", warn: "var(--warn)", info: "var(--muted)" };
    return `<div class="section-h">Comm check — SPINS → JCEOI → Comm Plan → CSAR, packages, ATO</div>${xs.length ? `<ul class="small" style="margin:4px 0 10px">${xs.map(x =>
      `<li style="color:${col[x.sev]}">${x.sev === "bad" ? "✕" : x.sev === "warn" ? "!" : "·"} ${esc(x.text)}</li>`).join("")}</ul>` : `<p class="small" style="color:var(--ok)">✓ No comm disconnects.</p>`}`;
  }
  function jceoiCheck(m) {
    const X = AOC.JCEOI, tk = X.theaterKey(campaign.theater), tp = X.plan(tk), rows = [], chans = AOC.COMM.channels(m).filter(c => c.freq);
    // the standard value in the channel's own band (an FM JTAC is compared with the FM standard)
    const stdIn = (std, f) => { const b = X.bandOf(f); return [std.uhf, std.uhfAlt, std.vhf, std.fm, std.hf].find(x => x != null && X.bandOf(x) === b) ?? std.uhf; };
    chans.forEach(c => {
      const f = parseFloat(c.freq), pc = tp ? X.planChannel(tk, c.id) : null;
      // in a pre-decided theater a channel that matches the plan only answers for official assignments to someone else
      const asPlan = pc && pc.role === c.role && pc.freq && Math.abs(+pc.freq - f) < 1e-6;
      let hits = isFinite(f) ? X.conflicts(f, tk) : [];
      if (tp) hits = hits.filter(h => !(h.kind === "nttr" && X.agrees({ ...c, net: c.col?.title }, h)) && (!asPlan || h.kind === "nttr"));
      const std = tp ? null : X.net(c.id);
      const off = std && std.role === c.role && ![std.uhf, std.uhfAlt, std.vhf, std.fm, std.hf].some(x => x != null && Math.abs(x - f) < 1e-6);
      const roleOff = std && std.role !== c.role ? std.role : null;   // the channel holds a different net from the JCEOI standard
      const offPlan = tp && (!pc || pc.role !== c.role || !pc.freq || Math.abs(+pc.freq - f) > 1e-6) ? pc || {} : null;
      const dup = chans.filter(o => o !== c && Math.abs(parseFloat(o.freq) - f) < 1e-6).map(o => o.id);
      if (hits.length || off || roleOff || offPlan || dup.length || !isFinite(f)) rows.push({ c, hits, std: off ? stdIn(std, f) : null, roleOff, offPlan, dup, bad: !isFinite(f) });
    });
    const n = chans.length;
    const iffN = AOC.IFF ? AOC.IFF.check(cid, Store.content(cid, "ato")?.missions || [], tk).filter(f => f.sev === "error").length : 0;
    return `<div class="section-h">JCEOI check — ${esc(tk || campaign.theater)}${tk ? "" : " (no JCEOI register for this theater)"}</div>
      ${AOC.IFF ? `<p class="small">IFF: ${iffN ? `<span style="color:var(--danger, #e5484d)">${iffN} IFF error${iffN === 1 ? "" : "s"} on the ATO</span>` : "ATO IFF codes clear"} · <a href="product.html?p=ato&c=${encodeURIComponent(cid)}">ATO →</a></p>` : ""}
      ${tp ? `<p class="small">${esc(tk)} has a pre-decided frequency plan (NTTR): channels are checked against the CAOC NTTR comm matrix and the official NTTR / Nellis assignments. <a href="jceoi.html#nttr" target="_blank" rel="noopener">NTTR plan →</a></p>` : ""}
      ${X.inSync ? "" : `<p class="small" style="color:var(--warn)">The JCEOI data is out of step with this Comm Plan template — rebuild it (tools/jceoi/build.py) before relying on "JCEOI standard".</p>`}
      ${!rows.length ? `<p class="small" style="color:var(--ok)">✓ All ${n} channels are clear of the ${esc(tk)} register and match the ${tp ? "NTTR plan" : "JCEOI standard plan"}.</p>` : `<table class="small"><tbody>${rows.map(({ c, hits, std, roleOff, offPlan, dup, bad }) =>
        `<tr><td class="mono">${esc(c.id)}</td><td>${esc(c.role || "")} ${esc(c.callsign || "")}</td><td class="mono">${esc(c.freq)}</td><td>${bad ? `<span style="color:var(--warn)">not a frequency</span>`
          : hits.length ? `<span style="color:var(--danger, #e5484d)">✕ ${hits.slice(0, 3).map(h => `${esc(h.site)} ${esc(h.use)} ${h.mhz.toFixed(3)}`).join("; ")}${hits.length > 3 ? ` +${hits.length - 3}` : ""}</span>` : ""}
          ${dup.length ? ` <span style="color:var(--warn)">same frequency as ${dup.map(esc).join(", ")}</span>` : ""}
          ${std != null ? ` <span class="muted">· JCEOI standard ${std.toFixed(3)}</span>` : ""}
          ${roleOff ? ` <span class="muted">· JCEOI standard net here: ${esc(roleOff)}</span>` : ""}
          ${offPlan ? ` <span style="color:var(--warn)">· NTTR plan: ${offPlan.freq ? `${esc(offPlan.role || "")} ${esc(offPlan.callsign || "")} ${esc(offPlan.freq)}` : "no such channel"}</span>` : ""}</td></tr>`).join("")}</tbody></table>
        <p class="small muted">✕ = within one channel of a documented frequency in this theater. "JCEOI standard" = this channel differs from the standard plan (allowed; tankers and JTACs often change).</p>`}`;
  }
  function matrixAction(b) {
    const key = P.fields.find(f => f.type === "matrix").key, m = normalizeMatrix(key);
    if (b.dataset.mx === "addcol") {
      const used = m.columns.map(c => c.color), color = Object.keys(MX_COLORS).find(n => !used.includes(n)) || "GRAY";
      m.columns.push({ title: "NEW NET", color, cells: Array.from({ length: m.rows }, () => ({})) });
    } else if (b.dataset.mx === "delcol") {
      const c = m.columns[+b.dataset.i];
      if (c.cells.some(x => x.role || x.callsign || x.freq) && !confirm(`Remove the ${c.color} column and its channels?`)) return;
      m.columns.splice(+b.dataset.i, 1);
    } else if (b.dataset.mx === "jceoiFill" || b.dataset.mx === "jceoiReset") {
      const tp = AOC.JCEOI.plan(AOC.JCEOI.theaterKey(campaign.theater));
      if (b.dataset.mx === "jceoiReset" && !confirm(`Replace every channel with the ${tp ? "NTTR plan" : "JCEOI standard net plan"}?`)) return;
      // a pre-decided theater fills and resets from its own plan
      const nets = tp ? tp.caoc.matrix.columns.flatMap(col => col.cells.map((c, r) => ({ color: col.color, net: col.title, row: r + 1, role: c.role || "", callsign: c.callsign || "", uhf: c.freq ? +c.freq : null })))
        : AOC.JCEOI.data.nets;
      if (b.dataset.mx === "jceoiReset") {
        const order = [...new Set(nets.map(n => n.color))];
        m.rows = Math.max(...nets.map(n => n.row));
        m.columns = order.map(color => ({ title: nets.find(n => n.color === color).net, color, cells: Array.from({ length: m.rows }, (_, r) => ({})) }));
      }
      m.columns.forEach(col => col.cells.forEach((x, r) => { const n = nets.find(n => n.color === col.color && n.row === r + 1);
        if (!n) return; if (!x.freq && n.uhf != null) x.freq = n.uhf.toFixed(3); if (!x.role) x.role = n.role; if (!x.callsign && n.callsign) x.callsign = n.callsign; }));
    } else if (b.dataset.mx === "addrow") m.rows++;
    else if (b.dataset.mx === "delrow" && m.rows > 1) {
      if (m.columns.some(c => { const x = c.cells[m.rows - 1] || {}; return x.role || x.callsign || x.freq; }) && !confirm(`Remove row ${m.rows} and its channels?`)) return;
      m.rows--; m.columns.forEach(c => c.cells.length = m.rows);
    }
    markDirty(); buildForm(); renderDoc();
  }

  function setPath(path, value) {
    const parts = path.split(".");
    let o = data;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }

  let dirty = false;
  form.addEventListener("input", e => {
    if (e.target.dataset.acft) {
      const [k, i] = e.target.dataset.acft.split("."), row = data[k][+i], m = e.target.value.match(/^\s*(\d+)\s*[x×*]\s*(.*)$/i);
      if (m) { row.num = m[1]; row.type = m[2].trim(); } else row.type = e.target.value.trim();
      markDirty(); if (document.getElementById("iffCheck")) document.getElementById("iffCheck").innerHTML = iffCheckHtml(); renderDoc(); return;
    }
    const path = e.target.dataset.path;
    if (!path) return;
    setPath(path, e.target.type === "checkbox" ? e.target.checked : e.target.value);
    if (e.target.type === "checkbox" && /\.done$/.test(path)) { buildForm(); } // refresh the "n / m covered" count
    markDirty();
    if (/\.columns\.\d+\.color$/.test(path)) buildForm(); // recolour the column
    if (/^codewords\.\d+\.type$/.test(path)) buildForm(); // the code word list follows the type
    if (pid === "ato" && /^missions\./.test(path) && document.getElementById("iffCheck")) document.getElementById("iffCheck").innerHTML = iffCheckHtml();
    if (pid === "ato" && /^missions\./.test(path) && document.getElementById("tgtCheck")) document.getElementById("tgtCheck").innerHTML = tgtCheckHtml();
    if (pid === "optasklink" && document.getElementById("tdlCheck")) document.getElementById("tdlCheck").innerHTML = tdlCheckHtml();
    else if (/\.columns\./.test(path) && document.getElementById("jceoiCheck")) document.getElementById("jceoiCheck").innerHTML = jceoiCheck(normalizeMatrix(path.split(".")[0]));
    // TDP convenience: picking a JIPTL target pre-fills its basic data
    if (pid === "tdp" && path === "targetId") {
      const t = jiptl.find(r => r.id === e.target.value);
      if (t) { data.name = data.name || t.name; data.mgrs = data.mgrs || t.loc; data.category = data.category || t.cat; buildForm(); }
    }
    renderDoc();
  });
  form.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.mx) { matrixAction(b); return; }
    if (b.dataset.tdlact) {
      if (!confirm("Reassign every STN, SADL TN and IDM net? Pilots who already set theirs will need the new numbers.")) return;
      data = AOC.TDL.build(cid, data, { all: true }); markDirty(); buildForm(); renderDoc(); toast("Every datalink number reassigned"); return;
    }
    if (b.dataset.iffact) {
      if (b.dataset.iffact === "all" && !confirm("Reassign Mode 1 and Mode 3/A codes on every line?")) return;
      const n = AOC.IFF.assign(cid, data.missions || [], { all: b.dataset.iffact === "all" });
      markDirty(); buildForm(); renderDoc(); toast(n ? `IFF assigned to ${n} line${n === 1 ? "" : "s"}` : "Every line already has codes"); return;
    }
    const [key, idx] = (b.dataset.add || b.dataset.del || b.dataset.up || b.dataset.down || "").split(".");
    if (!key) return;
    const arr = data[key], i = +idx;
    if (b.dataset.add) { const f = P.fields[+b.dataset.fi] || P.fields.find(x => x.key === key); arr.push(f.type === "list" ? "" : { ...(f.newRow || {}) }); }
    else if (b.dataset.del) arr.splice(i, 1);
    else if (b.dataset.up && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    else if (b.dataset.down && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    markDirty();
    buildForm(); renderDoc();
  });

  // ---------- preview & status ----------
  const doc = document.getElementById("doc");
  // unsaved edits are never shown as approved
  // a product with docs (SPINS & ROE) previews, copies, downloads and prints one document at a time; one approval covers all
  let docTab = 0;
  function renderDoc() {
    ctx.approval = dirty ? null : Store.approval(cid, pid);
    if (!P.docs) { doc.innerHTML = P.render(data, ctx); return; }
    const tabs = document.getElementById("docTabs"); tabs.classList.remove("hidden");
    tabs.innerHTML = P.docs.map((x, i) => `<button data-doc="${i}" aria-pressed="${i === docTab}">${esc(x.label)}</button>`).join("");
    doc.innerHTML = P.docs[docTab].render(data, ctx);
  }
  document.getElementById("docTabs").onclick = e => { const b = e.target.closest("[data-doc]"); if (b) { docTab = +b.dataset.doc; renderDoc(); doc.scrollTop = 0; } };
  function markDirty() { dirty = true; renderButtons(); }

  // Workflow: staff build and save (ready) → CFACC (or CFC) approves, here or in PUBLISH → PUBLISH on the Dashboard releases it
  function renderButtons() {
    const s = Store.status(cid, pid), canApprove = AOC.Auth.can("approve");
    const set = (id, enabled, title) => { const b = document.getElementById(id); b.disabled = !enabled; b.title = title || ""; };
    set("approve", canApprove && (dirty || ["draft", "review"].includes(s)),
      !canApprove ? "Only the CFACC (or CFC) can approve deliverables" : s === "approved" ? "Already approved" : "");
    const a = Store.approval(cid, pid);
    document.getElementById("approvalNote").textContent = dirty ? "Unsaved changes — will need approval"
      : a ? `Approved by ${a.by} (${a.role || "CFACC"}) · ${AOC.zulu(new Date(a.when))}`
      : s === "review" ? "Awaiting CFACC approval" : "";
    if (s === "approved" && !dirty) document.getElementById("approvalNote").textContent += " — goes out with the next PUBLISH (Dashboard)";
  }
  function renderStatus() {
    renderButtons();
    const s = Store.status(cid, pid), el = document.getElementById("status");
    el.className = "badge " + s; el.textContent = STATUS_LABEL[s];
    const sh = Store.shared(cid, pid);
    document.getElementById("released").textContent = sh
      ? `Released v${sh.version} to ${sh.groups.map(g => Store.group(g)?.name).join(", ")} · ${AOC.zulu(new Date(sh.when))}${s !== "published" ? " — current edits not yet released" : ""}`
      : "Not yet released to any group";
  }

  function persist(status, msg) {
    // the ATO assigns IFF codes itself on every save: lines with none, or a Mode 3/A that no longer follows its Mode 1
    if (pid === "ato" && AOC.IFF) { const n = AOC.IFF.assign(cid, data.missions || [], { all: false }); if (n) { msg += `, IFF codes assigned to ${n} line${n === 1 ? "" : "s"}`; buildForm(); } }
    Store.setContent(cid, pid, structuredClone(data));
    // any saved edit becomes a draft again and needs fresh approval; units keep the last released version
    Store.setStatus(cid, pid, status || "review");
    Store.log(cid, `${P.code} ${msg}`);
    dirty = false;
    renderStatus(); renderDoc();
  }

  document.getElementById("save").onclick = () => {
    if (!dirty && Store.status(cid, pid) !== "none") { toast("No changes to save"); return; }
    persist(null, "saved, ready for CFACC approval"); toast("Saved — ready for CFACC approval");
  };
  document.getElementById("approve").onclick = () => {
    if (!AOC.Auth.can("approve")) return;
    persist("approved", `approved by ${user.callsign} (${user.role})`); toast("Approved");
  };
  document.getElementById("clear").onclick = () => {
    if (!confirm("Clear all fields in this product? (Saved copy is kept until you save again.)")) return;
    data = {}; P.fields.forEach(f => { if (f.type === "table" || f.type === "list") data[f.key] = []; });
    markDirty(); buildForm(); renderDoc();
  };

  // Export
  const fname = ext => `${campaign.opName.replace(/\s+/g, "_")}_${P.docs ? P.docs[docTab].code : P.code}${data.atoDay ? "_D" + data.atoDay : ""}.${ext}`;
  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(doc.innerText); toast("Copied — paste into Discord or a briefing"); }
    catch { toast("Clipboard unavailable"); }
  };
  document.getElementById("txt").onclick = () => download(fname("txt"), doc.innerText, "text/plain");
  document.getElementById("json").onclick = () => download(fname("json"), JSON.stringify({ campaign: cid, product: pid, data }, null, 2), "application/json");
  document.getElementById("print").onclick = () => window.print();

  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  if (tdlRebuilt) dirty = true;
  buildForm(); renderDoc(); renderStatus();
</script>
</body>
</html>
