<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — Product Builder</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>AOC.Auth.require();</script>
<script src="js/products.js"></script>

<main class="wrap">
  <div class="panel-head no-print" style="margin-bottom:16px">
    <div>
      <a href="index.html" class="small">← Dashboard</a>
      <h1 id="title" style="margin-top:4px"></h1>
      <div class="muted small" id="sub"></div>
      <div class="small" id="released" style="color:var(--ok)"></div>
      <div class="small" id="approvalNote" style="color:var(--accent)"></div>
    </div>
    <div class="toolbar">
      <a class="btn hidden" id="mapBtn" href="#" title="Points, nav/spider points and overlay shapes for this campaign">Theater map →</a>
      <a class="btn hidden" id="nomBtn" href="#" title="Build the JIPTL from the REDFOR order of battle, area of interest and key-task priorities">Target nomination →</a>
      <span class="badge" id="status"></span>
      <button class="btn" id="save">Save draft</button>
      <button class="btn" id="review">Submit for review</button>
      <button class="btn" id="approve">Approve</button>
      <button class="btn primary" id="publish">Publish to groups…</button>
    </div>
  </div>

  <div class="panel no-print hidden" id="reqBanner" style="margin-bottom:16px;border-color:var(--warn)"></div>

  <div class="builder">
    <section class="panel">
      <div class="panel-head"><h2>Build</h2>
        <div class="toolbar"><button class="btn sm ghost" id="clear">Clear form</button></div>
      </div>
      <form id="form" onsubmit="return false"></form>
    </section>
    <section class="sticky-preview">
      <div class="panel">
        <div class="panel-head no-print"><h2>Preview</h2>
          <div class="toolbar">
            <button class="btn sm" id="copy">Copy text</button>
            <button class="btn sm" id="txt">Download .txt</button>
            <button class="btn sm" id="json">Download .json</button>
            <button class="btn sm" id="print">Print / PDF</button>
            <button class="btn sm hidden" id="dks" disabled title="DKS integration coming soon — will push this matrix to the DKS comm page">Send to DKS</button>
            <button class="btn sm hidden" id="dksAgencies" title="Preview the agencies that will populate DKS “Manage Agencies”">Publish to DKS Agencies…</button>
          </div>
        </div>
        <article class="doc" id="doc"></article>
      </div>
    </section>
  </div>
</main>

<datalist id="jiptlList"></datalist>
<datalist id="msnList"></datalist>

<script>
  const { Store, esc, PRODUCTS, STATUS_LABEL, toast } = AOC;
  AOC.renderChrome();

  const qs = new URLSearchParams(location.search);
  const pid = qs.get("p"), cid = qs.get("c") || Store.currentCampaignId(), reqId = qs.get("req");
  const P = PRODUCTS[pid];
  if (!P) { location.replace("index.html"); throw new Error("unknown product"); }
  const campaign = Store.campaign(cid);
  const user = AOC.Auth.user();
  const ctx = { campaign, user, group: id => Store.group(id) };

  document.title = `Virtual AOC — ${P.code}`;
  document.getElementById("title").textContent = `${P.code} · ${P.name}`;
  document.getElementById("sub").textContent = `OP ${campaign.opName} · ${campaign.theater} · owner: ${P.owner}`;
  if (P.mapLink) {
    const mb = document.getElementById("mapBtn");
    mb.href = `map.html?c=${encodeURIComponent(cid)}`; mb.classList.remove("hidden");
  }
  if (P.nomination) {
    const nb = document.getElementById("nomBtn");
    nb.href = `targeting.html?c=${encodeURIComponent(cid)}`; nb.classList.remove("hidden");
  }
  // Products with a comm matrix need the full width, and get the (future) DKS hand-off
  if (P.fields.some(f => f.type === "matrix")) {
    document.querySelector(".builder").style.gridTemplateColumns = "minmax(0, 1fr)";
    document.getElementById("dks").classList.remove("hidden");
    document.getElementById("dksAgencies").classList.remove("hidden");
  }

  // DKS "Manage Agencies": every matrix channel with a frequency becomes a selectable default agency in DKS.
  // The integration isn't built yet, so this shows exactly what would be sent.
  document.getElementById("dksAgencies").onclick = () => {
    const key = P.fields.find(f => f.type === "matrix").key;
    const all = AOC.COMM.channels(data[key]);
    // agencies without a callsign are named role + channel (e.g. "BOOM BLUE 1") so they stay distinct in DKS
    const agencies = all.filter(c => c.freq).map(c => ({ name: c.callsign || `${c.role} ${c.id}`, role: c.role, channel: c.id, net: c.col.title, freq: c.freq }));
    const skipped = all.filter(c => !c.freq);
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="panel modal" style="max-width:720px">
      <h2>Publish to DKS Agencies</h2>
      <p class="muted small">These ${agencies.length} agencies will populate DKS <b>Manage Agencies</b> as selectable defaults for every group planning OP ${esc(campaign.opName)}.</p>
      <div class="table-scroll" style="max-height:50vh"><table><thead><tr><th>Agency</th><th>Role</th><th>Channel</th><th>Net</th><th>Freq</th></tr></thead>
        <tbody>${agencies.map(a => `<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.role)}</td><td class="mono">${esc(a.channel)}</td><td>${esc(a.net)}</td><td class="mono">${esc(a.freq)}</td></tr>`).join("")}</tbody></table></div>
      ${skipped.length ? `<p class="small" style="color:var(--warn)">Skipped — no frequency: ${skipped.map(c => `${esc(c.id)} (${esc(c.role || c.callsign)})`).join(", ")}</p>` : ""}
      ${dirty || Store.status(cid, pid) !== "published" ? `<p class="small" style="color:var(--warn)">Only the released, approved Comm Plan should go to DKS — publish this version first.</p>` : ""}
      <div class="toolbar" style="justify-content:flex-end;margin-top:12px">
        <button class="btn" data-x>Close</button>
        <button class="btn primary" disabled title="Waiting on the DKS integration">Publish to DKS — integration coming soon</button></div></div>`;
    document.body.appendChild(back);
    back.onclick = e => { if (e.target === back || e.target.closest("[data-x]")) back.remove(); };
  };

  // working copy of the product data
  let data = structuredClone(Store.content(cid, pid) || {});
  P.fields.forEach(f => {
    if (f.type === "table" || f.type === "list") data[f.key] = data[f.key] || [];
    if (pid === "ato" || pid === "aod") { if (f.key === "atoDay" && !data.atoDay) data.atoDay = String(campaign.atoDay || 1); }
  });

  // JIPTL target IDs feed TDP and ATO target fields
  const jiptl = Store.content(cid, "jiptl")?.rows || [];
  document.getElementById("jiptlList").innerHTML = jiptl.map(r => `<option value="${esc(r.id)}">${esc(r.name)}</option>`).join("");
  // ATO missions feed the Comm Plan and BDA/MISREP mission fields
  const atoMsns = Store.content(cid, "ato")?.missions || [];
  document.getElementById("msnList").innerHTML = atoMsns.map(m => `<option value="${esc(m.msn)}">${esc(m.callsign)} · ${esc(m.role)}</option>`).join("");

  // Request banner (when arriving via "Fulfil")
  const req = reqId && Store.db.requests.find(r => r.id === reqId);
  if (req) {
    const b = document.getElementById("reqBanner");
    b.classList.remove("hidden");
    b.innerHTML = `<b>Fulfilling request</b> from ${esc(Store.group(req.group)?.name)}: <span class="muted">${esc(req.note)}</span> — publishing will mark it fulfilled and share with that group.`;
  }

  // ---------- form building ----------
  const form = document.getElementById("form");

  function cellInput(col, val, path) {
    const a = `data-path="${path}"`;
    if (col.type === "select") return `<select ${a}><option></option>${col.options.map(o => `<option ${o === val ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    if (col.type === "groups") return `<select ${a}><option></option>${campaign.groups.map(g => `<option value="${g}" ${g === val ? "selected" : ""}>${esc(Store.group(g).name)}</option>`).join("")}</select>`;
    if (col.type === "jiptl") return `<input ${a} list="jiptlList" value="${esc(val)}">`;
    if (col.type === "msn") return `<input ${a} list="msnList" value="${esc(val)}">`;
    return `<input ${a} value="${esc(val)}">`;
  }

  function buildForm() {
    let html = "", halfOpen = false;
    const closeHalf = () => { if (halfOpen) { html += "</div>"; halfOpen = false; } };
    P.fields.forEach(f => {
      if (f.type === "section") { closeHalf(); html += `<div class="section-h">${esc(f.label)}</div>`; return; }
      if (f.half && !halfOpen) { html += `<div class="row2">`; halfOpen = true; }
      else if (!f.half) closeHalf();
      const v = data[f.key] ?? "";
      const hint = f.hint ? `<div class="hint">${esc(f.hint)}</div>` : "";
      if (f.type === "textarea") html += `<div class="field"><label>${esc(f.label)}</label><textarea data-path="${f.key}">${esc(v)}</textarea>${hint}</div>`;
      else if (f.type === "list") html += `<div class="field list-edit"><label>${esc(f.label)}</label>
        ${v.map((item, i) => `<div class="item"><input data-path="${f.key}.${i}" value="${esc(item)}"><button class="btn sm ghost" data-del="${f.key}.${i}" title="Remove">✕</button></div>`).join("")}
        <button class="btn sm" data-add="${f.key}">+ Add</button></div>`;
      else if (f.type === "table") html += `<div class="field"><label>${esc(f.label)}</label><div class="grid-edit"><table>
        <thead><tr>${f.rank ? "<th>#</th>" : ""}${f.columns.map(c => `<th style="${c.w ? `width:${c.w}px` : ""}">${esc(c.label)}</th>`).join("")}<th></th></tr></thead>
        <tbody>${v.map((row, i) => `<tr>${f.rank ? `<td class="mono small" style="padding:8px">${i + 1}</td>` : ""}
          ${f.columns.map(c => `<td>${cellInput(c, row[c.key] ?? "", `${f.key}.${i}.${c.key}`)}</td>`).join("")}
          <td class="rowact">${f.rank ? `<button data-up="${f.key}.${i}" title="Move up">↑</button><button data-down="${f.key}.${i}" title="Move down">↓</button>` : ""}
          <button data-del="${f.key}.${i}" title="Delete row">✕</button></td></tr>`).join("")}</tbody></table></div>
        <button class="btn sm" data-add="${f.key}" style="margin-top:6px">+ Add row</button>${hint}</div>`;
      else if (f.type === "matrix") html += matrixEditor(f);
      else if (f.type === "jiptl") html += `<div class="field"><label>${esc(f.label)}</label><input data-path="${f.key}" list="jiptlList" value="${esc(v)}">${hint}</div>`;
      else html += `<div class="field"><label>${esc(f.label)}</label><input data-path="${f.key}" value="${esc(v)}">${hint}</div>`;
    });
    closeHalf();
    form.innerHTML = html;
  }

  // ---------- comm matrix editor: one coloured column per net, channels numbered top-down ----------
  const { COLORS: MX_COLORS, cellStyle, blankMatrix } = AOC.COMM;
  function normalizeMatrix(key) {
    const m = data[key] = data[key] || blankMatrix();
    m.columns.forEach(c => { c.cells = c.cells || []; while (c.cells.length < m.rows) c.cells.push({}); });
    return m;
  }
  function matrixEditor(f) {
    const m = normalizeMatrix(f.key), k = f.key;
    return `<div class="field"><label>${esc(f.label)}</label><div class="mx-edit">
      ${m.columns.map((c, ci) => `<div class="mx-col" style="${cellStyle(c.color)}">
        <div class="mx-h">
          <input data-path="${k}.columns.${ci}.title" value="${esc(c.title)}" placeholder="Net name" title="Net name, e.g. TANKERS">
          <select data-path="${k}.columns.${ci}.color" title="Column colour">${Object.keys(MX_COLORS).map(n => `<option ${n === c.color ? "selected" : ""}>${n}</option>`).join("")}</select>
          <button class="btn sm" data-mx="delcol" data-i="${ci}" title="Remove this column">Remove column</button>
        </div>
        ${Array.from({ length: m.rows }, (_, r) => { const p = `${k}.columns.${ci}.cells.${r}`, x = c.cells[r];
          return `<div class="mx-cell"><span class="id">${esc(c.color)} ${r + 1}</span>
            <input data-path="${p}.role" value="${esc(x.role)}" placeholder="Role (e.g. TAC COORD)">
            <input class="cs" data-path="${p}.callsign" value="${esc(x.callsign)}" placeholder="CALLSIGN">
            <input data-path="${p}.freq" value="${esc(x.freq)}" placeholder="Freq (e.g. 293.500)"></div>`; }).join("")}
      </div>`).join("")}
    </div>
    <div class="mx-tools"><button class="btn sm" data-mx="addcol" data-k="${k}">+ Column</button>
      <button class="btn sm" data-mx="addrow" data-k="${k}">+ Row</button>
      <button class="btn sm" data-mx="delrow" data-k="${k}" ${m.rows <= 1 ? "disabled" : ""}>− Last row</button></div>
    <div class="hint">Each cell is a channel named by colour and row — e.g. RAZOR on 293.500 is WHITE 1.</div></div>`;
  }
  function matrixAction(b) {
    const key = P.fields.find(f => f.type === "matrix").key, m = normalizeMatrix(key);
    if (b.dataset.mx === "addcol") {
      const used = m.columns.map(c => c.color), color = Object.keys(MX_COLORS).find(n => !used.includes(n)) || "GRAY";
      m.columns.push({ title: "NEW NET", color, cells: Array.from({ length: m.rows }, () => ({})) });
    } else if (b.dataset.mx === "delcol") {
      const c = m.columns[+b.dataset.i];
      if (c.cells.some(x => x.role || x.callsign || x.freq) && !confirm(`Remove the ${c.color} column and its channels?`)) return;
      m.columns.splice(+b.dataset.i, 1);
    } else if (b.dataset.mx === "addrow") m.rows++;
    else if (b.dataset.mx === "delrow" && m.rows > 1) {
      if (m.columns.some(c => { const x = c.cells[m.rows - 1] || {}; return x.role || x.callsign || x.freq; }) && !confirm(`Remove row ${m.rows} and its channels?`)) return;
      m.rows--; m.columns.forEach(c => c.cells.length = m.rows);
    }
    markDirty(); buildForm(); renderDoc();
  }

  function setPath(path, value) {
    const parts = path.split(".");
    let o = data;
    for (let i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = value;
  }

  let dirty = false;
  form.addEventListener("input", e => {
    const path = e.target.dataset.path;
    if (!path) return;
    setPath(path, e.target.value);
    markDirty();
    if (/\.columns\.\d+\.color$/.test(path)) buildForm(); // recolour the column
    // TDP convenience: picking a JIPTL target pre-fills its basic data
    if (pid === "tdp" && path === "targetId") {
      const t = jiptl.find(r => r.id === e.target.value);
      if (t) { data.name = data.name || t.name; data.mgrs = data.mgrs || t.loc; data.category = data.category || t.cat; buildForm(); }
    }
    renderDoc();
  });
  form.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.mx) { matrixAction(b); return; }
    const [key, idx] = (b.dataset.add || b.dataset.del || b.dataset.up || b.dataset.down || "").split(".");
    if (!key) return;
    const arr = data[key], i = +idx;
    if (b.dataset.add) arr.push(P.fields.find(f => f.key === key).type === "list" ? "" : {});
    else if (b.dataset.del) arr.splice(i, 1);
    else if (b.dataset.up && i > 0) [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    else if (b.dataset.down && i < arr.length - 1) [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]];
    markDirty();
    buildForm(); renderDoc();
  });

  // ---------- preview & status ----------
  const doc = document.getElementById("doc");
  // unsaved edits are never shown as approved
  function renderDoc() { ctx.approval = dirty ? null : Store.approval(cid, pid); doc.innerHTML = P.render(data, ctx); }
  function markDirty() { dirty = true; renderButtons(); }

  // Workflow: staff build → submit for review → CFACC (or CFC) approves → CFACC/CFC publishes
  function renderButtons() {
    const s = Store.status(cid, pid), canApprove = AOC.Auth.can("approve"), canPublish = AOC.Auth.can("publish");
    const set = (id, enabled, title) => { const b = document.getElementById(id); b.disabled = !enabled; b.title = title || ""; };
    set("review", dirty || ["none", "draft"].includes(s), s === "review" ? "Already waiting on CFACC approval" : "");
    set("approve", canApprove && (dirty || ["draft", "review"].includes(s)),
      !canApprove ? "Only the CFACC (or CFC) can approve deliverables" : s === "approved" ? "Already approved" : "");
    set("publish", canPublish && s === "approved" && !dirty,
      !canPublish ? "Only the CFACC (or CFC) can publish" : dirty ? "Save and approve your changes first" : s !== "approved" ? "Needs CFACC approval before publishing" : "");
    const a = Store.approval(cid, pid);
    document.getElementById("approvalNote").textContent = dirty ? "Unsaved changes — will need approval"
      : a ? `Approved by ${a.by} (${a.role || "CFACC"}) · ${AOC.zulu(new Date(a.when))}`
      : s === "review" ? "Awaiting CFACC approval" : "";
  }
  function renderStatus() {
    renderButtons();
    const s = Store.status(cid, pid), el = document.getElementById("status");
    el.className = "badge " + s; el.textContent = STATUS_LABEL[s];
    const sh = Store.shared(cid, pid);
    document.getElementById("released").textContent = sh
      ? `Released v${sh.version} to ${sh.groups.map(g => Store.group(g)?.name).join(", ")} · ${AOC.zulu(new Date(sh.when))}${s !== "published" ? " — current edits not yet released" : ""}`
      : "Not yet released to any group";
  }

  function persist(status, msg) {
    Store.setContent(cid, pid, structuredClone(data));
    // any saved edit becomes a draft again and needs fresh approval; units keep the last released version
    Store.setStatus(cid, pid, status || "draft");
    Store.log(cid, `${P.code} ${msg}`);
    dirty = false;
    renderStatus(); renderDoc();
  }

  document.getElementById("save").onclick = () => {
    if (!dirty && Store.status(cid, pid) !== "none") { toast("No changes to save"); return; }
    persist(null, "saved"); toast("Draft saved");
  };
  document.getElementById("review").onclick = () => { persist("review", "submitted for CFACC review"); toast("Submitted for CFACC review"); };
  document.getElementById("approve").onclick = () => {
    if (!AOC.Auth.can("approve")) return;
    persist("approved", `approved by ${user.callsign} (${user.role})`); toast("Approved");
  };
  document.getElementById("clear").onclick = () => {
    if (!confirm("Clear all fields in this product? (Saved copy is kept until you save again.)")) return;
    data = {}; P.fields.forEach(f => { if (f.type === "table" || f.type === "list") data[f.key] = []; });
    markDirty(); buildForm(); renderDoc();
  };

  // Publish modal: choose which participating groups receive the product
  document.getElementById("publish").onclick = () => {
    if (!AOC.Auth.can("publish") || Store.status(cid, pid) !== "approved" || dirty) return;
    const back = document.createElement("div");
    back.className = "modal-back";
    back.innerHTML = `<div class="panel modal"><h2>Publish ${P.code}</h2>
      <p class="muted small">Share this product with participating groups in OP ${esc(campaign.opName)}.</p>
      ${campaign.groups.map(g => `<label class="check-row"><input type="checkbox" value="${g}" ${!req || req.group === g ? "checked" : ""}> ${esc(Store.group(g).name)}</label>`).join("")}
      <div class="toolbar" style="justify-content:flex-end;margin-top:14px">
        <button class="btn" data-x>Cancel</button><button class="btn primary" data-ok>Publish</button></div></div>`;
    document.body.appendChild(back);
    back.querySelector("[data-x]").onclick = () => back.remove();
    back.querySelector("[data-ok]").onclick = () => {
      const ids = [...back.querySelectorAll("input:checked")].map(i => i.value);
      const to = ids.map(id => Store.group(id).name);
      if (!to.length) { toast("Select at least one group"); return; }
      Store.publish(cid, pid, ids, data);
      persist("published", `v${Store.shared(cid, pid).version} published to ${to.join(", ")}`);
      if (req) { req.state = "fulfilled"; Store.save(); }
      back.remove();
      toast(`Published to ${to.length} group${to.length > 1 ? "s" : ""}`);
    };
  };

  // Export
  const fname = ext => `${campaign.opName.replace(/\s+/g, "_")}_${P.code}${data.atoDay ? "_D" + data.atoDay : ""}.${ext}`;
  function download(name, text, type) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  document.getElementById("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(doc.innerText); toast("Copied — paste into Discord or a briefing"); }
    catch { toast("Clipboard unavailable"); }
  };
  document.getElementById("txt").onclick = () => download(fname("txt"), doc.innerText, "text/plain");
  document.getElementById("json").onclick = () => download(fname("json"), JSON.stringify({ campaign: cid, product: pid, data }, null, 2), "application/json");
  document.getElementById("print").onclick = () => window.print();

  window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });

  buildForm(); renderDoc(); renderStatus();
</script>
</body>
</html>
