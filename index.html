<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — Campaign Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>AOC.Auth.require();</script>
<script src="js/products.js"></script>

<main class="wrap">
  <section class="campaign-head">
    <div>
      <div class="op">Operation</div>
      <h1 id="opName"></h1>
      <div class="campaign-meta" id="meta"></div>
    </div>
    <div class="campaign-select">
      <label for="campaign">Selected campaign</label>
      <select id="campaign"></select>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <div class="grid cols-dash">
    <section class="panel">
      <div class="panel-head">
        <h2>Products</h2>
        <div class="seg" role="group" aria-label="Layout">
          <button data-layout="tiles">Tiles</button>
          <button data-layout="rhythm">Battle rhythm</button>
          <button data-layout="table">Table</button>
        </div>
      </div>
      <div id="products"></div>
    </section>

    <aside class="grid" style="align-content:start">
      <section class="panel" id="deliverables"></section>
      <section class="panel">
        <div class="panel-head"><h2>Product requests</h2><span class="muted small" id="reqCount"></span></div>
        <ul class="list" id="requests"></ul>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Participating groups</h2><a class="small" href="unit.html">Op Status →</a></div>
        <ul class="list" id="groups"></ul>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Recent activity</h2></div>
        <ul class="list small" id="activity"></ul>
      </section>
    </aside>
  </div>
</main>

<script>
  const { Store, esc, PRODUCTS, FUTURE, STAGES, STATUS_LABEL } = AOC;
  AOC.renderChrome();

  let cid = Store.currentCampaignId();
  let layout = (() => { try { return localStorage.getItem("aoc.layout") || "tiles"; } catch { return "tiles"; } })();

  const sel = document.getElementById("campaign");
  sel.innerHTML = Store.db.campaigns.map(c => `<option value="${c.id}">OP ${esc(c.opName)} — ${esc(c.theater)}</option>`).join("");
  sel.value = cid;
  sel.onchange = () => { cid = sel.value; Store.setCurrentCampaign(cid); render(); };

  document.querySelectorAll("[data-layout]").forEach(b => b.onclick = () => {
    layout = b.dataset.layout;
    try { localStorage.setItem("aoc.layout", layout); } catch {}
    renderProducts();
  });

  const link = pid => `product.html?p=${pid}&c=${encodeURIComponent(cid)}`;

  function tile(pid) {
    const p = PRODUCTS[pid], s = Store.status(cid, pid);
    return `<a class="tile" href="${link(pid)}">
      <span class="code">${p.code}</span><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
      <div class="foot"><span class="badge ${s}">${STATUS_LABEL[s]}</span><span>${s === "none" ? "Build →" : "Open →"}</span></div></a>`;
  }
  function futureTile(f) {
    return `<div class="tile future" title="To be defined"><span class="code">${f.code}</span><h3>${esc(f.name)}</h3>
      <p>${esc(f.desc)}</p><div class="foot"><span class="badge none">Planned</span></div></div>`;
  }

  function renderProducts() {
    document.querySelectorAll("[data-layout]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.layout === layout)));
    const el = document.getElementById("products");
    const ids = Object.keys(PRODUCTS);

    if (layout === "tiles") {
      el.innerHTML = `<div class="tiles">${ids.map(tile).join("")}${FUTURE.map(futureTile).join("")}</div>`;
    } else if (layout === "rhythm") {
      // highlight the first stage that still has unpublished work
      const active = STAGES.find(st => ids.some(id => PRODUCTS[id].stage === st.id && Store.status(cid, id) !== "published"))?.id;
      el.innerHTML = `<div class="rhythm">${STAGES.map(st => `<div class="stage ${st.id === active ? "active" : ""}">
        <div class="stage-h">Stage ${st.id}<b>${st.name}</b>${esc(st.desc)}</div>
        ${ids.filter(id => PRODUCTS[id].stage === st.id).map(tile).join("")}
        ${FUTURE.filter(f => f.stage === st.id).map(futureTile).join("")}</div>`).join("")}</div>
        <p class="muted small">Daily cycle: guidance flows left to right; assessment feeds the next day's strategy.</p>`;
    } else {
      const c = Store.campaign(cid);
      el.innerHTML = `<div class="table-scroll"><table><thead><tr><th>Code</th><th>Product</th><th>Owner</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>
        ${ids.map(id => { const p = PRODUCTS[id], s = Store.status(cid, id), u = c.updated?.[id];
          return `<tr><td class="mono">${p.code}</td><td>${esc(p.name)}</td><td class="muted">${esc(p.owner)}</td>
          <td><span class="badge ${s}">${STATUS_LABEL[s]}</span></td><td class="muted">${u ? AOC.zulu(new Date(u)) : "—"}</td>
          <td><a class="btn sm" href="${link(id)}">${s === "none" ? "Build" : "Open"}</a></td></tr>`; }).join("")}
        ${FUTURE.map(f => `<tr class="muted"><td class="mono">${f.code}</td><td>${esc(f.name)}</td><td>—</td><td><span class="badge none">Planned</span></td><td></td><td></td></tr>`).join("")}
        </tbody></table></div>`;
    }
  }

  // CFACC view: every deliverable this campaign needs, by where it sits in the approval workflow
  function renderDeliverables() {
    const c = Store.campaign(cid);
    const needed = (c.productsWanted || Object.keys(PRODUCTS)).filter(id => PRODUCTS[id]);
    const buckets = [
      ["review", "Awaiting CFACC approval", "warn"],
      ["approved", "Approved — ready to publish", "ok"],
      ["draft", "In work", "off"],
      ["none", "Not started", "off"],
      ["published", "Released", "ok"]
    ];
    const done = needed.filter(id => ["approved", "published"].includes(Store.status(cid, id))).length;
    const canApprove = AOC.Auth.can("approve");
    document.getElementById("deliverables").innerHTML = `<div class="panel-head"><h2>Deliverables</h2><span class="muted small">${done} / ${needed.length} approved</span></div>
      <div class="bar" style="height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-bottom:10px"><i style="display:block;height:100%;width:${needed.length ? done / needed.length * 100 : 0}%;background:var(--ok)"></i></div>
      <p class="muted small" style="margin-top:0">The CFACC makes sure every deliverable is built and approved. ${canApprove ? "You can approve and publish." : "Approval and publishing are done by the CFACC or CFC."}</p>
      <ul class="list">${buckets.map(([st, label, dot]) => {
        const ids = needed.filter(id => Store.status(cid, id) === st);
        if (!ids.length) return "";
        return `<li><span class="dot ${dot}"></span><div class="grow"><b class="small">${label}</b><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">
          ${ids.map(id => `<a class="btn sm" href="${link(id)}">${PRODUCTS[id].code}</a>`).join("")}</div></div></li>`;
      }).join("")}</ul>`;
  }

  function render() {
    renderDeliverables();
    const c = Store.campaign(cid), db = Store.db;
    document.getElementById("opName").textContent = "OP " + c.opName;
    document.getElementById("meta").innerHTML = `
      <span>JFACC <b>${c.jfacc ? `${esc(c.jfacc.callsign)} (${esc(Store.group(c.jfacc.group)?.name || "")})` : "Not named"}</b></span>
      <span>Theater <b>${esc(c.theater)}</b></span><span>Phase <b>${esc(c.phase)}</b></span>
      <span>D-Day <b>${esc(c.dday)}</b></span><span>ATO Day <b>${c.atoDay || "—"}</b></span><span>ATO period <b>${esc(c.atoPeriod)}</b></span>`;

    const statuses = Object.keys(PRODUCTS).map(id => Store.status(cid, id));
    const ato = Store.content(cid, "ato"), jiptl = Store.content(cid, "jiptl");
    const sorties = (ato?.missions || []).reduce((s, r) => s + (parseInt(r.num) || 0), 0);
    const openReq = db.requests.filter(r => r.campaign === cid && r.state === "open");
    const kpis = [
      [statuses.filter(s => s === "published").length + " / " + statuses.length, "Products published"],
      [jiptl?.rows?.length || 0, "Targets on JIPTL"],
      [sorties, "Sorties on current ATO"],
      [c.groups.length, "Participating groups"],
      [openReq.length, "Open requests"]
    ];
    document.getElementById("kpis").innerHTML = kpis.map(([v, l]) => `<div class="panel kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

    document.getElementById("reqCount").textContent = openReq.length + " open";
    document.getElementById("requests").innerHTML = openReq.length ? openReq.map(r => {
      const g = Store.group(r.group), p = PRODUCTS[r.product];
      return `<li><span class="dot warn"></span><div class="grow"><b>${esc(g?.name)}</b> · <span class="mono small">${p?.code}</span>
        <div class="muted small">${esc(r.note)}</div></div>
        <a class="btn sm primary" href="${link(r.product)}&req=${r.id}">Fulfil</a></li>`;
    }).join("") : `<li class="muted">No open requests.</li>`;

    document.getElementById("groups").innerHTML = c.groups.map(gid => {
      const g = Store.group(gid);
      return `<li><span class="dot ${g.status === "active" ? "ok" : "warn"}"></span><div class="grow"><b>${esc(g.name)}</b>
        <div class="muted small">${esc(g.airframes)} · liaison ${esc(g.contact)} · ${Store.sharedWith(cid, gid).length} products released</div></div>
        <span class="muted small">${g.status}</span></li>`;
    }).join("");

    const act = (db.activity || []).filter(a => a.cid === cid).slice(0, 6);
    document.getElementById("activity").innerHTML = act.length ? act.map(a =>
      `<li><div class="grow">${esc(a.text)}<div class="muted">${AOC.zulu(new Date(a.when))} · ${esc(a.by || "")}</div></div></li>`).join("")
      : `<li class="muted">No activity yet this session.</li>`;

    renderProducts();
  }
  render();
</script>
</body>
</html>
