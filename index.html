<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — Campaign Dashboard</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>AOC.Auth.require();</script>
<script src="js/products.js"></script>
<script src="js/pr.js"></script>
<script src="js/ato.js"></script>
<script src="js/package.js"></script>
<script src="js/jceoi-data.js"></script>
<script src="js/jceoi.js"></script>
<script src="js/iff.js"></script>
<script src="js/miz.js"></script>
<script src="js/tdl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<main class="wrap">
  <section class="campaign-head">
    <div>
      <div class="op">Operation</div>
      <h1 id="opName"></h1>
      <div class="campaign-meta" id="meta"></div>
    </div>
    <div class="campaign-select">
      <label for="campaign">Selected campaign</label>
      <select id="campaign"></select>
    </div>
  </section>

  <section class="kpis" id="kpis"></section>

  <section class="panel" id="publishPanel" style="margin-bottom:16px"></section>

  <div class="grid cols-dash">
    <section class="panel">
      <div class="panel-head">
        <h2>Products</h2>
        <div class="seg" role="group" aria-label="Layout">
          <button data-layout="tiles">Tiles</button>
          <button data-layout="rhythm">Battle rhythm</button>
          <button data-layout="table">Table</button>
        </div>
      </div>
      <div id="products"></div>
    </section>

    <aside class="grid" style="align-content:start">
      <section class="panel" id="atoLines"></section>
      <section class="panel">
        <div class="panel-head"><h2>Participating groups</h2><a class="small" href="unit.html">Op Status →</a></div>
        <ul class="list" id="groups"></ul>
      </section>
      <section class="panel">
        <div class="panel-head"><h2>Recent activity</h2></div>
        <ul class="list small" id="activity"></ul>
      </section>
    </aside>
  </div>
</main>

<script>
  const { Store, esc, PRODUCTS, FUTURE, STAGES, STATUS_LABEL, COMMS } = AOC;
  AOC.renderChrome();

  let cid = Store.currentCampaignId();
  let layout = (() => { try { return localStorage.getItem("aoc.layout") || "tiles"; } catch { return "tiles"; } })();

  const sel = document.getElementById("campaign");
  sel.innerHTML = Store.db.campaigns.map(c => `<option value="${c.id}">OP ${esc(c.opName)} — ${esc(c.theater)}</option>`).join("");
  sel.value = cid;
  sel.onchange = () => { cid = sel.value; Store.setCurrentCampaign(cid); render(); };

  document.querySelectorAll("[data-layout]").forEach(b => b.onclick = () => {
    layout = b.dataset.layout;
    try { localStorage.setItem("aoc.layout", layout); } catch {}
    renderProducts();
  });

  const link = pid => `product.html?p=${pid}&c=${encodeURIComponent(cid)}`;

  // products the host didn't ask for (PACKAGE.wanted; internal products are always built)
  const skipped = pid => !AOC.PACKAGE.INTERNAL.has(pid) && !AOC.PACKAGE.wanted(Store.campaign(cid)).includes(pid);
  function tile(pid) {
    const p = PRODUCTS[pid], s = Store.status(cid, pid), off = skipped(pid);
    return `<a class="tile" href="${link(pid)}"${off ? ' style="opacity:.5" title="The host didn\'t ask for this product"' : ""}>
      <span class="code">${p.code}</span><h3>${esc(p.name)}</h3><p>${esc(p.desc)}</p>
      <div class="foot">${off ? `<span class="badge none">Not requested</span>` : `<span class="badge ${s}">${STATUS_LABEL[s]}</span>`}<span>${s === "none" ? "Build →" : "Open →"}</span></div></a>`;
  }
  // reference pages in a product group: no workflow status
  function pageTile(pg) {
    return `<a class="tile" href="${pg.href}"><span class="code">${esc(pg.code)}</span><h3>${esc(pg.name)}</h3><p>${esc(pg.desc)}</p>
      <div class="foot"><span class="badge none">Reference</span><span>Open →</span></div></a>`;
  }
  const commsGroup = inner => `<div class="pgroup"><div class="pgroup-h"><b>${esc(COMMS.name)}</b>${esc(COMMS.desc)}</div>${inner}</div>`;
  const commsTiles = () => COMMS.products.filter(id => PRODUCTS[id]).map(tile).join("") + COMMS.pages.map(pageTile).join("");
  function futureTile(f) {
    return `<div class="tile future" title="To be defined"><span class="code">${f.code}</span><h3>${esc(f.name)}</h3>
      <p>${esc(f.desc)}</p><div class="foot"><span class="badge none">Planned</span></div></div>`;
  }

  function renderProducts() {
    document.querySelectorAll("[data-layout]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.layout === layout)));
    const el = document.getElementById("products");
    const ids = Object.keys(PRODUCTS), solo = ids.filter(id => !COMMS.products.includes(id));

    if (layout === "tiles") {
      el.innerHTML = `<div class="tiles">${solo.map(tile).join("")}${FUTURE.map(futureTile).join("")}</div>${commsGroup(`<div class="tiles">${commsTiles()}</div>`)}`;
    } else if (layout === "rhythm") {
      // highlight the first stage that still has unpublished work
      const active = STAGES.find(st => ids.some(id => PRODUCTS[id].stage === st.id && !skipped(id) && Store.status(cid, id) !== "published"))?.id;
      el.innerHTML = `<div class="rhythm">${STAGES.map(st => `<div class="stage ${st.id === active ? "active" : ""}">
        <div class="stage-h">Stage ${st.id}<b>${st.name}</b>${esc(st.desc)}</div>
        ${solo.filter(id => PRODUCTS[id].stage === st.id).map(tile).join("")}
        ${FUTURE.filter(f => f.stage === st.id).map(futureTile).join("")}
        ${COMMS.products.some(id => PRODUCTS[id]?.stage === st.id) ? commsGroup(commsTiles()) : ""}</div>`).join("")}</div>
        <p class="muted small">Daily cycle: guidance flows left to right; assessment feeds the next day's strategy.</p>`;
    } else {
      const c = Store.campaign(cid);
      const row = id => { const p = PRODUCTS[id], s = Store.status(cid, id), u = c.updated?.[id], off = skipped(id);
        return `<tr${off ? ' class="muted"' : ""}><td class="mono">${p.code}</td><td>${esc(p.name)}</td><td class="muted">${esc(p.owner)}</td>
          <td>${off ? `<span class="badge none">Not requested</span>` : `<span class="badge ${s}">${STATUS_LABEL[s]}</span>`}</td><td class="muted">${u ? AOC.zulu(new Date(u)) : "—"}</td>
          <td><a class="btn sm" href="${link(id)}">${s === "none" ? "Build" : "Open"}</a></td></tr>`; };
      el.innerHTML = `<div class="table-scroll"><table><thead><tr><th>Code</th><th>Product</th><th>Owner</th><th>Status</th><th>Updated</th><th></th></tr></thead><tbody>
        ${solo.map(row).join("")}
        <tr class="pgroup-row"><td colspan="6">${esc(COMMS.name)}</td></tr>
        ${COMMS.products.filter(id => PRODUCTS[id]).map(row).join("")}
        ${COMMS.pages.map(pg => `<tr><td class="mono">${esc(pg.code)}</td><td>${esc(pg.name)}</td><td class="muted">CAOC</td><td><span class="badge none">Reference</span></td><td class="muted">—</td>
          <td><a class="btn sm" href="${pg.href}">Open</a></td></tr>`).join("")}
        ${FUTURE.map(f => `<tr class="muted"><td class="mono">${f.code}</td><td>${esc(f.name)}</td><td>—</td><td><span class="badge none">Planned</span></td><td></td><td></td></tr>`).join("")}
        </tbody></table></div>`;
    }
  }

  // ATO lines requested by the campaign's JFACC and their commitment state (commits arrive from the Discord post)
  function renderAtoLines() {
    const ls = AOC.ATO.lines(cid).filter(l => l.status !== "cancelled"), el = document.getElementById("atoLines");
    const open = ls.filter(l => l.status === "open"), done = ls.filter(l => l.status === "committed"), drafts = ls.filter(l => l.status === "draft");
    el.innerHTML = `<div class="panel-head"><h2>ATO line requests</h2><span class="muted small">${done.length} filled · ${open.length} open${drafts.length ? ` · ${drafts.length} draft` : ""}</span></div>
      ${ls.length ? `<ul class="list">${[...open, ...drafts, ...done, ...ls.filter(l => l.status === "ai")].map(l => `<li><span class="dot ${l.status === "committed" ? "ok" : l.status === "open" ? "warn" : "off"}"></span>
        <div class="grow"><b class="mono small">${esc(l.msn)}</b> ${l.num}× ${esc(l.airframe)} · ${esc(l.role)}
        <div class="muted small">${l.status === "committed" ? `Filled by ${esc(Store.group(l.committedBy)?.name)}` : l.status === "open" ? `Awaiting commit · posted to ${l.recipients.length} group${l.recipients.length === 1 ? "" : "s"}` : l.status === "draft" ? "Draft — the host hasn't posted it yet" : "AI — sponsor builds"} · requested by ${esc(Store.group(l.requestedBy)?.name)}</div></div></li>`).join("")}</ul>`
        : `<p class="muted small" style="margin:0">No requests yet. The campaign's Group JFACC requests lines from the unit portal.</p>`}`;
  }
  window.addEventListener("storage", e => { if (e.key && e.key.startsWith("aoc.db")) location.reload(); });

  // PUBLISH: the one release. Products are built and approved on their pages; this releases them to the groups, sends the
  // DKS exports and posts the pilot package zip to Discord (package.js)
  function renderPublish() {
    const PK = AOC.PACKAGE, c = Store.campaign(cid), want = PK.wanted(c), st = pid => Store.status(cid, pid), rel = c.packageRelease;
    const by = s => want.filter(pid => st(pid) === s), ex = PK.dksExports(cid), can = AOC.Auth.can("publish");
    const changed = want.filter(pid => ["approved", "review"].includes(st(pid)));
    const chip = (ids, label, dot) => ids.length ? `<li><span class="dot ${dot}"></span><div class="grow"><b class="small">${label}</b><div style="margin-top:4px;display:flex;gap:6px;flex-wrap:wrap">
      ${ids.map(id => `<a class="btn sm" href="${link(id)}">${PRODUCTS[id].code}</a>`).join("")}</div></div></li>` : "";
    const dks = [["Overlay", ex.overlay.last], ["Agencies", ex.agencies.last], ["Kneeboard", ex.kneeboard.last]]
      .map(([n, l]) => `${n} ${l ? `v${l.v}` : "not sent"}`).join(" · ");
    document.getElementById("publishPanel").innerHTML = `<div class="panel-head"><div><h2>PUBLISH</h2>
        <div class="muted small">${rel ? `Last: package v${rel.version}, ATO ${esc(AOC.atoId(rel.atoDay))}, ${esc(AOC.zulu(new Date(rel.when)))} by ${esc(rel.by || "")}` : "Nothing published yet"} · DKS ${esc(dks)}</div></div>
        <div class="toolbar">${rel ? `<button class="btn" id="zipBtn" title="The pilot package as posted to Discord, rebuilt from the released versions">Download pilot package (zip)</button>` : ""}
          <a class="btn ghost" href="rollup.html?c=${encodeURIComponent(cid)}">Deadlines, DKS detail, Discord post →</a>
          ${c.atoDay > 0 ? `<button class="btn" id="cycleBtn" ${can ? "" : "disabled"} title="After the host's debrief: the daily products go back to work for the next ATO">Cycle to ATO ${esc(AOC.atoId(+c.atoDay + 1))}…</button>` : ""}
          <button class="btn primary" id="pubBtn" ${can ? "" : "disabled title=\"CFACC or CFC only\""}>PUBLISH${changed.length ? ` (${changed.length})` : ""}…</button></div></div>
      <p class="small" style="margin:0 0 8px">One button: approves what's waiting (CFACC), releases every approved product to the groups' Op Status, sends the DKS exports (Overlay, Manage Agencies, kneeboards) and posts the pilot package zip to every group's Discord.</p>
      <p class="small" style="margin:0 0 8px">Products wanted: <b>${esc(want.map(id => PRODUCTS[id].code).join(", "))}</b>${want.length === 1 ? " (the ATO only: it still posts to Discord)" : ""}
        ${can ? `<button class="btn sm ghost" id="wantBtn" title="What the host asked for; the ATO is always produced">Change…</button>` : ""}</p>
      <ul class="list">${chip(by("approved"), "Approved — goes out with the next PUBLISH", "ok")}${chip(by("review"), "Saved and ready — the CFACC approves them in PUBLISH", "warn")}${chip(by("draft"), "Back in work for this ATO — open and save to make ready", "off")}${chip(by("none"), "Not started", "off")}${chip(by("published"), "Released and current", "ok")}</ul>
      ${(() => { const b = PK.bullseyeCheck(cid); return b ? `<p class="small" style="color:var(--warn);margin:8px 0 0">Host mission file v${b.v} moved the BLUE bullseye; PUBLISH will update the SPINS.</p>` : ""; })()}`;
    document.getElementById("pubBtn").onclick = () => PK.publishDialog(cid, () => render());
    document.getElementById("cycleBtn")?.addEventListener("click", () => PK.cycleDialog(cid, () => render()));
    document.getElementById("wantBtn")?.addEventListener("click", () => PK.wantedDialog(cid, () => { render(); renderProducts(); }));
    document.getElementById("zipBtn")?.addEventListener("click", async e => { e.target.disabled = true;
      try { const z = await PK.downloadZip(cid); AOC.toast(`${z.filename}: ${z.docs.length} documents`); } catch (err) { AOC.toast(err.message); } e.target.disabled = false; });
  }

  function render() {
    renderPublish();
    renderAtoLines();
    const c = Store.campaign(cid), db = Store.db;
    document.getElementById("opName").textContent = "OP " + c.opName;
    document.getElementById("meta").innerHTML = `
      <span>JFACC <b>${c.jfacc ? `${esc(c.jfacc.callsign)} (${esc(Store.group(c.jfacc.group)?.name || "")})` : "Not named"}</b></span>
      <span>Theater <b>${esc(c.theater)}</b></span><span>Phase <b>${esc(c.phase)}</b></span>
      <span>D-Day <b>${esc(c.dday)}</b></span><span>ATO <b>${AOC.atoId(c.atoDay)}</b></span><span>ATO period <b>${esc(c.atoPeriod)}</b></span>`;

    const statuses = Object.keys(PRODUCTS).filter(id => !skipped(id)).map(id => Store.status(cid, id));
    const ato = Store.content(cid, "ato"), jiptl = Store.content(cid, "jiptl");
    const sorties = (ato?.missions || []).reduce((s, r) => s + (parseInt(r.num) || 0), 0);
    const kpis = [
      [statuses.filter(s => s === "published").length + " / " + statuses.length, "Products published"],
      [jiptl?.rows?.length || 0, "Targets on JIPTL"],
      [sorties, "Sorties on current ATO"],
      [c.groups.length, "Participating groups"],
      [AOC.ATO.lines(cid).filter(l => l.status === "open").length, "ATO lines awaiting commit"]
    ];
    document.getElementById("kpis").innerHTML = kpis.map(([v, l]) => `<div class="panel kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

    document.getElementById("groups").innerHTML = c.groups.map(gid => {
      const g = Store.group(gid);
      return `<li><span class="dot ${g.status === "active" ? "ok" : "warn"}"></span><div class="grow"><b>${esc(g.name)}</b>
        <div class="muted small">${esc(g.airframes)} · liaison ${esc(g.contact)} · ${Store.sharedWith(cid, gid).length} products released</div></div>
        <span class="muted small">${g.status}</span></li>`;
    }).join("");

    const act = (db.activity || []).filter(a => a.cid === cid).slice(0, 6);
    document.getElementById("activity").innerHTML = act.length ? act.map(a =>
      `<li><div class="grow">${esc(a.text)}<div class="muted">${AOC.zulu(new Date(a.when))} · ${esc(a.by || "")}</div></div></li>`).join("")
      : `<li class="muted">No activity yet this session.</li>`;

    renderProducts();
  }
  render();
</script>
</body>
</html>
