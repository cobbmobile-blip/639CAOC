<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Virtual AOC — JCEOI</title>
<link rel="stylesheet" href="css/styles.css">
<style>
  .tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-size: 13px; padding: 8px 12px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .jt td, .jt th { font-size: 12px; padding: 4px 6px; white-space: nowrap; }
  .jt td.wrap { white-space: normal; }
  .jt .mono { font-family: var(--mono); }
  .chip-id { display: inline-block; min-width: 72px; padding: 1px 6px; border-radius: 3px; font: 600 11px var(--mono); text-align: center; border: 1px solid #0003; }
  .ok { color: var(--ok); } .bad { color: var(--danger, #e5484d); } .warnt { color: var(--warn); }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 10px; }
  .filters label { margin: 0 0 2px; font-size: 10.5px; }
  .filters select, .filters input { width: auto; padding: 4px 6px; font-size: 12px; }
  .ranges { font: 12px/1.7 var(--mono); column-width: 230px; column-gap: 20px; }
  .kpi-row { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .kpi-row .panel { padding: 10px 14px; margin: 0; }
  .kpi-row b { display: block; font: 600 20px var(--mono); }
</style>
</head>
<body>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>AOC.Auth.require();</script>
<script src="js/products.js"></script>
<script src="js/jceoi-data.js"></script>
<script src="js/jceoi.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<main class="wrap">
  <div class="panel-head" style="margin-bottom:12px">
    <div><h1 id="title">JCEOI</h1>
      <div class="muted small">Joint Communications-Electronics Operating Instructions for vCAOC campaigns in DCS World. Per-theater registers of the documented in-game and
        real-world frequencies, the standard Blue net plan (the Comm Plan matrix, clear in every theater), and the pool of clear channels.</div></div>
    <div class="toolbar"><button class="btn primary" id="xlsxBtn">Download .xlsx</button></div>
  </div>
  <div class="panel hidden" id="stale" style="border-color:var(--danger, #e5484d);margin-bottom:12px"></div>
  <div class="kpi-row" id="kpis"></div>
  <div class="tabs" id="tabs"></div>
  <section class="panel" id="body"></section>
</main>

<script>
  const { esc, toast, JCEOI: X, COMM } = AOC;
  AOC.renderChrome();
  const J = X.data;
  document.getElementById("title").textContent = `${J.title}`;
  const TABS = [["plan", "Net plan"], ["presets", "Preset load"], ["nttr", "Nevada (NTTR plan)"], ["register", "Theater registers"], ["pool", "Clear channels"], ["check", "Check a frequency"], ["about", "Sources & coverage"]];
  let tab = location.hash === "#nttr" ? "nttr" : (() => { try { return localStorage.getItem("aoc.jceoiTab") || "plan"; } catch { return "plan"; } })();
  const f3 = f => f == null ? "—" : (+f).toFixed(3);
  const KIND = { nttr: "NTTR assigned", dcs: "DCS ATC", "dcs-nav": "DCS nav", civil: "Real-world civil", nav: "Real-world nav", military: "Real-world military", common: "Common / standard", guard: "Guard" };
  const allFreqs = n => ["uhf", "uhfAlt", "vhf", "fm", "hf"].map(k => n[k]).filter(v => v != null);
  // a channel fixed by the CAOC keeps its known conflicts (reported in the note), everything else must be clear
  const known = (n, h) => (J.fixedConflicts || []).some(c => c.id === n.id && c.site === h.site);
  const planClear = n => allFreqs(n).every(f => !X.conflicts(f, null).filter(h => !known(n, h)).length);

  if (!X.inSync) { const st = document.getElementById("stale"); st.classList.remove("hidden");
    st.innerHTML = `<b>Out of date.</b> This JCEOI was built from a different Comm Plan template than the site now uses, so its net plan may not match the ACP.
      New Comm Plans start without JCEOI frequencies until it is rebuilt: run <span class="mono">python tools/jceoi/build.py</span>.`; }
  const total = X.theaters.reduce((s, t) => s + t.count, 0) + J.common.length;
  document.getElementById("kpis").innerHTML = [[J.nets.length, "standard channels"], [J.nets.reduce((s, n) => s + allFreqs(n).length, 0), "assigned frequencies"],
    [X.theaters.length, `theaters (${X.theaters.filter(t => t.dcs).length} with DCS data)`], [total.toLocaleString(), "documented entries"],
    [J.nets.filter(n => !planClear(n)).length, `conflicts in any theater${(J.fixedConflicts || []).length ? " (besides fixed RAZOR, see note)" : ""}`]]
    .map(([v, l]) => `<div class="panel"><b>${v}</b><span class="muted small">${l}</span></div>`).join("");

  function renderTabs() {
    document.getElementById("tabs").innerHTML = TABS.map(([k, l]) => `<button data-t="${k}" aria-selected="${k === tab}">${l}</button>`).join("");
    try { localStorage.setItem("aoc.jceoiTab", tab); } catch {}
  }
  document.getElementById("tabs").onclick = e => { const b = e.target.closest("[data-t]"); if (b) { tab = b.dataset.t; renderTabs(); render(); } };

  const theaterOpts = (all, sel) => (all ? `<option value="">All theaters</option>` : "") + X.theaters.map(t => `<option value="${esc(t.key)}" ${t.key === sel ? "selected" : ""}>${esc(t.key)}${t.status !== "released" ? " (in development)" : ""}</option>`).join("");

  // ---------- tabs ----------
  const views = {
    plan() {
      const fc = J.fixedConflicts || [];
      return `${fc.length ? `<p class="small" style="color:var(--warn)">Note: ${[...new Set(fc.map(c => c.id))].map(id => { const hs = fc.filter(c => c.id === id);
          return `${esc(id)} ${f3(hs[0].mhz)} is fixed by the CAOC, but in ${esc([...new Set(hs.map(h => h.theater))].join(", "))} it is also ${esc([...new Set(hs.map(h => h.site))].join(" / "))}`; }).join("; ")}.
          It is kept as decided and shows as a conflict there.</p>` : ""}<p class="small muted">The net list is the Comm Plan (ACP) template itself — same channels, nets and roles${X.inSync ? " (in step)" : " (<b>out of step — rebuild</b>)"}; every new Comm Plan starts with these UHF primaries filled in. Guard (121.500 / 243.000) is standard and is not a net.
        Every frequency below is clear of everything documented in every theater (± one channel, ±${J.guardZone * 1000} kHz around Guard).</p>
        <div class="table-scroll"><table class="jt"><thead><tr><th>Channel</th><th>Net</th><th>Role</th><th>Callsign</th><th>UHF primary</th><th>UHF alternate</th><th>VHF-AM</th><th>VHF-FM</th><th>HF</th><th>Check</th></tr></thead><tbody>
        ${J.nets.map(n => `<tr><td><span class="chip-id" style="${cellStyle(n.color)}">${esc(n.id)}</span></td><td>${esc(n.net)}</td><td>${esc(n.role)}</td><td>${esc(n.callsign)}</td>
          <td class="mono">${f3(n.uhf)}</td><td class="mono">${f3(n.uhfAlt)}</td><td class="mono">${f3(n.vhf)}</td><td class="mono">${f3(n.fm)}</td><td class="mono">${f3(n.hf)}</td>
          <td class="${planClear(n) ? "ok" : "bad"}">${planClear(n) ? "✓ clear in all" : "✕ conflict"}</td></tr>`).join("")}</tbody></table></div>
        <div class="section-h">Plan rules</div>
        <ul class="small"><li>UHF primaries sit in one slice per net: TACTICAL AIR 230–260, RESCUE 260–275, TAC ADMIN 290–305, TANKERS 305–320, GROUND COORD 320–340, SPARES 340–360 MHz. Every UHF alternate is in 360–400 MHz.</li>
          <li>VHF-AM backups are in 138–152 MHz (the NATO military VHF segment inside the DCS VHF radios' 116–151.975 MHz range), for aircraft without UHF.</li>
          <li>VHF-FM is given to ground coordination and rescue nets (30–88 MHz, avoiding the 38–42.4 MHz block DCS uses for airfield FM). HF is given to C2 and CSAR (5–9 MHz).</li>
          <li>WHITE 1 TAC COORD is RAZOR by CAOC decision; its frequency is picked clear like the rest (it moved off 293.500, which is ROULETTE at the NTTR). Tankers and JTACs are the nets most likely to change during a campaign; change them in the campaign's Comm Plan, not here.</li></ul>`;
    },
    presets() {
      // a standard load for radios with 20 presets: UHF on radio 1, VHF on radio 2
      const order = ["WHITE 1", "WHITE 2", "WHITE 3", "WHITE 4", "YELLOW 1", "YELLOW 2", "YELLOW 3", "YELLOW 4", "YELLOW 5", "BLUE 1", "BLUE 2", "BLUE 3", "BLUE 4", "BLUE 5", "GREEN 1", "GREEN 2", "PURPLE 1", "PURPLE 2", "PURPLE 3", "PURPLE 5"];
      return `<p class="small muted">Standard preset load for 20-channel radios. UHF on the primary radio, VHF-AM backups on the secondary; Guard stays on the guard receiver. Groups load this in DKS or the mission editor.</p>
        <div class="table-scroll"><table class="jt"><thead><tr><th>Preset</th><th>Channel</th><th>Role</th><th>UHF (radio 1)</th><th>VHF-AM (radio 2)</th><th>VHF-FM (FM radio)</th></tr></thead><tbody>
        ${order.map((id, i) => { const n = X.net(id); return `<tr><td class="mono">${i + 1}</td><td><span class="chip-id" style="${cellStyle(n.color)}">${esc(id)}</span></td><td>${esc(n.role)}${n.callsign ? ` (${esc(n.callsign)})` : ""}</td>
          <td class="mono">${f3(n.uhf)}</td><td class="mono">${f3(n.vhf)}</td><td class="mono">${f3(n.fm)}</td></tr>`; }).join("")}</tbody></table></div>`;
    },
    nttr() {
      const p = X.plan("Nevada"); if (!p) return `<p class="muted">No Nevada plan in this build.</p>`;
      const c = p.caoc, fs = X.planFindings("Nevada"), fr = a => a.map(f3).join(" / ");
      const tbl = (head, rows) => `<div class="table-scroll"><table class="jt"><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
      const skip = a => /unit option|HAVE QUICK|not used|squadron common/i.test(a || "");
      return `<p class="small">${esc(p.summary)} When a campaign's theater is <b>Nevada</b>, its Comm Plan starts from the CAOC NTTR comm matrix below and is checked against it and the official assignments.</p>
        <div class="section-h">Plan check — the CAOC NTTR plan against the official NTTR / Nellis assignments</div>
        <ul class="small" style="list-style:none;padding-left:0">${fs.map(f => `<li class="${f.sev === "warn" ? "warnt" : "muted"}">${f.sev === "warn" ? "!" : "·"} ${esc(f.text)}</li>`).join("") || `<li class="ok">✓ No differences.</li>`}</ul>
        ${p.revisions?.changes?.length ? `<div class="section-h">CAOC revisions (${esc(p.revisions.date)}) — applied on top of NTTR_COMM_PLAN.xlsx</div>
        ${tbl(["Item", "Was", "Now", "Why"], p.revisions.changes.map(r => `<tr><td>${esc(r.what)}</td><td class="mono">${esc(r.old ?? "")}</td><td class="mono"><b>${esc(r.new)}</b></td><td class="wrap">${esc(r.why)}</td></tr>`))}
        <p class="small muted">The spreadsheet and the NTTR comm card / matrix images still show the old values — use the .xlsx download (NTTR sheets) to update them.</p>` : ""}
        <div class="section-h">CAOC NTTR comm matrix (${esc(c.matrix.name)})</div>
        <div class="table-scroll"><table class="jt"><thead><tr><th></th>${c.matrix.columns.map(col => `<th><span class="chip-id" style="${cellStyle(col.color)}">${esc(col.color)}</span> ${esc(col.title)}</th>`).join("")}</tr></thead><tbody>
        ${Array.from({ length: c.matrix.rows }, (_, r) => `<tr><td class="mono">${r + 1}</td>${c.matrix.columns.map(col => { const x = col.cells[r] || {};
          return `<td><span class="muted">${esc(x.role || "")}</span><br><b>${esc(x.callsign || "")}</b> <span class="mono">${esc(x.freq || "")}</span></td>`; }).join("")}</tr>`).join("")}</tbody></table></div>
        <div class="section-h">Presets — CAOC comm card and Nellis local standard channelization (NELLISAFBI 11-250 Table A20.1)</div>
        ${tbl(["Preset", "CAOC UHF", "CAOC VHF", "Nellis channel", "Nellis UHF", "Nellis VHF"], c.presets.map(pr => { const o = p.channels.find(x => x.ch === pr.preset) || {};
          const d = o.uhf && pr.uhf && Math.abs(o.uhf - +pr.uhf) > 1e-6 && !skip(o.agency);
          return `<tr><td class="mono">${pr.preset}</td><td class="${d ? "warnt" : ""}">${esc(pr.uhfAgency)} <span class="mono">${esc(pr.uhf)}</span></td><td>${esc(pr.vhfAgency)} <span class="mono">${esc(pr.vhf)}</span></td>
            <td>${esc(o.agency || "")}</td><td class="mono">${o.uhf ? f3(o.uhf) : ""}</td><td class="mono">${o.vhf ? f3(o.vhf) : ""}</td></tr>`; }))}
        <div class="section-h">Tankers (CAOC NTTR plan)</div>
        ${tbl(["Callsign", "Type", "TACAN", "Track", "ARCP", "Altitude", "Frequency"], c.tankers.map(t => `<tr><td>${esc(t.callsign)}</td><td>${esc(t.type)}</td><td class="mono">${esc(t.tacan)}</td><td>${esc(t.track)}</td><td class="mono">${esc(t.arcp)}</td><td>${esc(t.alt)}</td><td class="mono">${esc(t.freq)} ${esc(t.channel)}</td></tr>`))}
        ${tbl(["AR track", "Altitude", "Frequency (CAOC)", "Control agency (NELLISAFBI 11-250 A20.3)"], c.tracks.map(t => { const key = t.track.replace(/[^0-9]/g, "");
          const ctl = p.control.find(x => x.agency.includes(`AR-${key}`));
          return `<tr><td>${esc(t.track)}</td><td>${esc(t.alt)}</td><td class="mono">${esc(t.freq)}</td><td>${ctl ? `${esc(ctl.agency)} <span class="mono">${fr(ctl.freqs)}</span>` : ""}</td></tr>`; }))}
        <div class="section-h">Range JTACs (CAOC)</div>
        ${tbl(["Range", "Callsign", "FM", "Laser", "Location", "Block"], c.jtacs.map(j => `<tr><td>${esc(j.range)}</td><td>${esc(j.callsign)}</td><td class="mono">${esc(j.fm)}</td><td class="mono">${esc(j.laser)}</td><td>${esc(j.loc)}</td><td>${esc(j.block)}</td></tr>`))}
        <div class="section-h">Official — range tactical frequencies (AFMAN 13-212V1 NTTR Add A, Table A14.1)</div>
        ${tbl(["Range / function", "Primary / secondary / tertiary"], p.tactical.map(t => `<tr><td>${esc(t.agency)}</td><td class="mono">${fr(t.freqs)}</td></tr>`))}
        <div class="section-h">Official — agencies (Table A14.2) and controlling agencies (NELLISAFBI 11-250 Table A20.3)</div>
        ${tbl(["Agency", "Frequencies", "Table"], [...p.agencies.map(a => ({ ...a, s: "A14.2" })), ...p.control.map(a => ({ ...a, s: "A20.3" }))].map(a => `<tr><td>${esc(a.agency)}</td><td class="mono">${fr(a.freqs)}</td><td>${a.s}</td></tr>`))}
        <div class="section-h">Official — squadron common frequencies (Table A20.2), reserved</div>
        ${tbl(["Unit", "Frequencies"], p.squadron.map(u => `<tr><td>${esc(u.unit)}</td><td class="mono wrap">${fr(u.freqs)}</td></tr>`))}
        <p class="small muted">Sources: ${Object.entries(p.sources).map(([k, v]) => /^https?:/.test(v) ? `<a href="${esc(v)}" target="_blank" rel="noopener">${esc(k)}</a>` : `${esc(k)} — ${esc(v)}`).join(" · ")}.
          Table A20.2 unit attribution follows the PDF's reading order; the frequencies are exact. For simulation only.</p>`;
    },
    register() {
      const s = state.reg;
      const t = X.theaters.find(x => x.key === s.theater);
      let list = X.register(s.theater).filter(e => (!s.band || e.band === s.band) && (!s.kind || e.kind === s.kind) && (!s.q || `${e.site} ${e.icao} ${e.use} ${e.mhz}`.toLowerCase().includes(s.q.toLowerCase())));
      const shown = list.slice(0, 1500);
      const by = k => list.filter(e => e.kind === k).length;
      return `<div class="filters"><div><label>Theater</label><select data-r="theater">${theaterOpts(false, s.theater)}</select></div>
          <div><label>Band</label><select data-r="band"><option value="">All</option>${["HF", "VHF-FM", "VHF-NAV", "VHF-AM", "VHF-MAR", "UHF", "LF/MF"].map(b => `<option ${b === s.band ? "selected" : ""}>${b}</option>`).join("")}</select></div>
          <div><label>Source</label><select data-r="kind"><option value="">All</option>${Object.entries(KIND).filter(([k]) => !["common", "guard"].includes(k)).map(([k, l]) => `<option value="${k}" ${k === s.kind ? "selected" : ""}>${l}</option>`).join("")}</select></div>
          <div><label>Search</label><input data-r="q" value="${esc(s.q)}" placeholder="site, ICAO, use, MHz"></div></div>
        <p class="small">${list.length} entries${list.length > shown.length ? ` (first ${shown.length} shown)` : ""} · DCS ATC ${by("dcs")} · DCS nav ${by("dcs-nav")} · civil ${by("civil")} · nav ${by("nav")} · military ${by("military")}
          ${t && !t.dcs ? `<br><span class="warnt">${esc(t.key)} is ${esc(t.status)}: no in-game DCS data yet — real-world entries only. Add the DCS register when the map ships.</span>` : ""}
          ${t?.tacan?.length ? `<br>DCS TACAN in use: ${t.tacan.map(b => `${b.ch} ${esc(b.callsign)}`).join(", ")}` : ""}</p>
        <div class="table-scroll" style="max-height:560px"><table class="jt"><thead><tr><th>MHz</th><th>Band</th><th>Site</th><th>ICAO</th><th>Use</th><th>Source</th><th>Confidence</th></tr></thead><tbody>
        ${shown.map(e => `<tr><td class="mono">${f3(e.mhz)}</td><td>${e.band}</td><td>${esc(e.site)}</td><td class="mono">${esc(e.icao)}</td><td class="wrap">${esc(e.use)}</td><td>${esc(KIND[e.kind] || e.kind)} <span class="muted">${esc(e.src)}</span></td>
          <td class="${e.conf === "unverified" || e.conf === "hobbyist" ? "warnt" : ""}">${esc(e.conf)}</td></tr>`).join("")}</tbody></table></div>`;
    },
    pool() {
      const s = state.pool, list = X.pool(s.theater || null, s.band);
      // consecutive clear channels collapse into ranges so the band reads at a glance
      const step = J.bands[s.band][2], ranges = [];
      list.forEach(c => { const r = ranges.at(-1); if (r && Math.abs(c.mhz - r[1] - step) < step / 2) { r[1] = c.mhz; r[2]++; } else ranges.push([c.mhz, c.mhz, 1]); });
      const [lo, hi] = J.bands[s.band], chans = Math.round((hi - lo) / step) + 1;
      return `<div class="filters"><div><label>Theater</label><select data-p="theater">${theaterOpts(true, s.theater)}</select></div>
          <div><label>Band</label><select data-p="band">${Object.keys(J.bands).map(b => `<option ${b === s.band ? "selected" : ""}>${b}</option>`).join("")}</select></div></div>
        <p class="small"><b>${list.length.toLocaleString()}</b> of ${chans.toLocaleString()} ${esc(s.band)} channels are clear ${s.theater ? `in ${esc(s.theater)}` : "in every theater"}
          (${f3(lo)}–${f3(hi)} MHz, ${step * 1000} kHz steps, one-channel separation from anything documented, Guard ±${J.guardZone * 1000} kHz excluded).
          ${list.filter(c => c.inPlan).length} of them are already in the standard net plan. Use these for campaign-specific nets.</p>
        <div class="ranges">${ranges.map(([a, b, n]) => `<div>${f3(a)}${n > 1 ? `–${f3(b)} <span class="muted">(${n})</span>` : ""}</div>`).join("")}</div>`;
    },
    check() {
      const v = state.check, f = parseFloat(v), hits = isFinite(f) ? X.conflicts(f, null) : [];
      const byT = {}; hits.forEach(h => (byT[h.theater] = byT[h.theater] || []).push(h));
      const inPlan = J.nets.filter(n => allFreqs(n).some(x => Math.abs(x - f) < 1e-6));
      return `<div class="filters"><div><label>Frequency (MHz)</label><input id="chkIn" value="${esc(v)}" placeholder="e.g. 251.000" inputmode="decimal"></div></div>
        ${!isFinite(f) ? `<p class="muted small">Type a frequency to check it against every theater register and the common list.</p>`
          : `<p class="small">${esc(f3(f))} MHz · ${esc(X.bandOf(f))} · ${hits.length ? `<span class="bad">${hits.length} documented within one channel</span>` : `<span class="ok">clear in every theater</span>`}
            ${inPlan.length ? ` · in the net plan as ${inPlan.map(n => esc(n.id)).join(", ")}` : ""}</p>
            ${Object.entries(byT).map(([t, hs]) => `<div class="section-h">${esc(t)}</div><table class="jt"><tbody>${hs.map(h => `<tr><td class="mono">${f3(h.mhz)}</td><td>${esc(h.site)}</td><td class="mono">${esc(h.icao || "")}</td><td class="wrap">${esc(h.use)}</td><td>${esc(KIND[h.kind] || h.kind)}</td><td>${esc(h.conf)}</td></tr>`).join("")}</tbody></table>`).join("")}`}`;
    },
    about() {
      const rows = X.theaters.map(t => { const r = X.register(t.key), n = k => r.filter(e => e.kind === k).length;
        return `<tr><td>${esc(t.key)}</td><td>${esc(t.status)}</td><td>${t.dcs ? n("dcs") : "—"}</td><td>${t.dcs ? n("dcs-nav") : "—"}</td><td>${n("civil")}</td><td>${n("nav")}</td><td>${n("military")}</td><td>${t.tacan.length || "—"}</td></tr>`; }).join("");
      return `<div class="section-h">Coverage by theater</div>
        <div class="table-scroll"><table class="jt"><thead><tr><th>Theater</th><th>Status</th><th>DCS ATC</th><th>DCS nav</th><th>Civil</th><th>Nav</th><th>Military</th><th>DCS TACAN</th></tr></thead><tbody>${rows}</tbody></table></div>
        <div class="section-h">Sources</div>
        <ul class="small">
          <li><b>DCS in-game</b>: airfield ATC radios (HF, VHF-FM, VHF-AM, UHF) and navigation beacons read from the local DCS World install (Mods/terrains/&lt;map&gt;/radio.lua, beacons.lua) for Caucasus, Nevada, Persian Gulf, Syria, Marianas, Sinai, Kola and Afghanistan;
            for Iraq, Germany (Cold War) and Falklands (not installed) from the <a href="https://github.com/dcs-retribution/pydcs" target="_blank" rel="noopener">pydcs terrain data</a> (DCS Retribution fork), cross-checked against the dcs-mcp server.</li>
          <li><b>Real-world civil</b>: airport frequencies and navaids from <a href="https://github.com/davidmegginson/ourairports-data" target="_blank" rel="noopener">OurAirports</a> (public domain), every airfield inside each theater's map rectangle.</li>
          <li><b>Real-world military</b>: FAA data via AirNav for <a href="https://www.airnav.com/airport/KLSV" target="_blank" rel="noopener">Nellis</a>, <a href="https://www.airnav.com/airport/KINS" target="_blank" rel="noopener">Creech</a>,
            <a href="https://www.airnav.com/airport/KTNX" target="_blank" rel="noopener">Tonopah Test Range</a>, <a href="https://www.airnav.com/airport/KNFL" target="_blank" rel="noopener">NAS Fallon</a>, <a href="https://www.airnav.com/airport/PGUA" target="_blank" rel="noopener">Andersen</a> (official);
            third-party listings for Mount Pleasant, Akrotiri, Incirlik, Al Dhafra, Ramstein, Spangdahlem and Evenes (unverified); <a href="https://www.qsl.net/cflg/top150.html" target="_blank" rel="noopener">qsl.net top-150 military list</a> for US common frequencies (hobbyist).</li>
          <li><b>Standard</b>: 121.500 / 243.000 Guard and 123.100 SAR (ICAO Annex 10); 156.800, 2.182 and 8.364 MHz distress (ITU).</li></ul>
        <div class="section-h">Known gaps</div>
        <ul class="small">
          <li>Military UHF is only published for US bases (FAA). Official UK, Turkish and UAE AIPs could not be reached for verification, so those bases are marked unverified. Russian, Iranian, Syrian, Israeli, Egyptian, Norwegian military and Cold War-era frequencies are not covered.</li>
          <li>Balkans, Iraq South and Afghanistan North have no DCS data yet; re-run tools/jceoi when they ship. Because the plan stays out of the blocks DCS uses for airfield radios on every released map, it is expected to hold.</li>
          <li>Germany (Cold War) uses today's civil frequencies; 1980s assignments differed.</li>
          <li>${esc(J.sourceNotes)}</li></ul>
        <p class="small muted">Generated ${esc(J.generated)} by tools/jceoi/build.py. Re-run extract_dcs.py after a DCS update, then build.py; it refuses to write a plan with any conflict.</p>`;
    }
  };
  const cellStyle = c => COMM.cellStyle ? COMM.cellStyle(c) : "";
  const state = { reg: { theater: "Caucasus", band: "", kind: "", q: "" }, pool: { theater: "", band: "UHF" }, check: "" };
  function render() {
    const el = document.getElementById("body"); el.innerHTML = views[tab]();
    const ci = document.getElementById("chkIn");
    if (ci) { ci.oninput = () => { state.check = ci.value; const pos = ci.selectionStart; render(); const n = document.getElementById("chkIn"); n.focus(); n.setSelectionRange(pos, pos); }; }
  }
  document.getElementById("body").addEventListener("change", e => {
    const r = e.target.dataset.r, p = e.target.dataset.p;
    if (r) { state.reg[r] = e.target.value; render(); } else if (p) { state.pool[p] = e.target.value; render(); }
  });
  document.getElementById("body").addEventListener("input", e => {
    if (e.target.dataset.r === "q") { state.reg.q = e.target.value; const pos = e.target.selectionStart; render(); const n = document.querySelector('[data-r="q"]'); n.focus(); n.setSelectionRange(pos, pos); }
  });

  // ---------- spreadsheet ----------
  document.getElementById("xlsxBtn").onclick = () => {
    if (!window.XLSX) { toast("The spreadsheet library didn't load"); return; }
    const wb = XLSX.utils.book_new(), add = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), name.slice(0, 31));
    add("Net plan", [["Channel", "Net", "Role", "Callsign", "UHF primary", "UHF alternate", "VHF-AM", "VHF-FM", "HF", "Clear in all theaters"],
      ...J.nets.map(n => [n.id, n.net, n.role, n.callsign, n.uhf, n.uhfAlt, n.vhf, n.fm ?? "", n.hf ?? "", planClear(n) ? "yes" : "NO"])]);
    X.theaters.forEach(t => add(t.key, [["MHz", "Band", "Site", "ICAO", "Use", "Source type", "Source", "Confidence"],
      ...X.register(t.key).map(e => [e.mhz, e.band, e.site, e.icao, e.use, KIND[e.kind] || e.kind, e.src, e.conf]),
      ...(t.tacan.length ? [[], ["DCS TACAN", "Channel", "Callsign", "Site"], ...t.tacan.map(b => ["", b.ch, b.callsign, b.site])] : [])]));
    const np = X.plan("Nevada");
    if (np) {
      add("NTTR CAOC matrix", [["Channel", "Net", "Role", "Callsign", "Freq"], ...np.caoc.matrix.columns.flatMap(col => col.cells.map((x, i) => [`${col.color} ${i + 1}`, col.title, x.role || "", x.callsign || "", x.freq || ""]))]);
      add("NTTR presets", [["Preset", "CAOC UHF agency", "UHF", "VHF", "VHF agency"], ...np.caoc.presets.map(p => [p.preset, p.uhfAgency, p.uhf, p.vhf, p.vhfAgency])]);
      add("NTTR tankers", [["Callsign", "Type", "TACAN", "Track", "ARCP", "Alt", "Freq"], ...np.caoc.tankers.map(t => [t.callsign, t.type, t.tacan, t.track, t.arcp, t.alt, t.freq])]);
      add("NTTR official", [["Agency / range", "MHz", "Table", "Source"], ...X.register("Nevada").filter(e => e.kind === "nttr").map(e => [e.site, e.mhz, e.use, e.src])]);
      add("NTTR plan check", [["Severity", "Finding"], ...X.planFindings("Nevada").map(f => [f.sev, f.text])]);
      add("NTTR revisions", [["Item", "Was", "Now", "Why"], ...(np.revisions?.changes || []).map(r => [r.what, r.old ?? "", r.new, r.why])]);
      add("NTTR JTACs", [["Range", "Callsign", "FM", "Laser", "Location", "Block"], ...np.caoc.jtacs.map(j => [j.range, j.callsign, j.fm, j.laser, j.loc, j.block])]);
      add("NTTR AR tracks", [["Track", "Altitude", "Frequency"], ...np.caoc.tracks.map(t => [t.track, t.alt, t.freq])]);
    }
    add("Common", [["MHz", "Band", "Use", "Source", "Confidence"], ...J.common.map(c => [c.mhz, c.band, c.use, c.src, c.conf])]);
    ["UHF", "VHF-AM", "VHF-FM", "HF"].forEach(b => add(`Clear ${b} (all)`, [["MHz", "In net plan"], ...X.pool(null, b).map(c => [c.mhz, c.inPlan ? "yes" : ""])]));
    add("Sources", [["Source", "Where"], ...Object.entries(J.sources), [], ["Notes", J.sourceNotes]]);
    XLSX.writeFile(wb, `vCAOC_JCEOI_${J.version}.xlsx`);
  };

  renderTabs(); render();
</script>
</body>
</html>
